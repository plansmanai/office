<style>
/* The Admin page. Lance, 23 Nov 2026, drawing a box at the right of the dashboard's tabs: "Make an area here that takes
   me to an admin page. That has the log out, the password change, and this inside of it like a settings section"
   ("this" is the Knowledge page). So this one page is Admin: its front lists the settings (Knowledge, Password, Sign
   out), and Knowledge opens inside it. A new setting is a new section on the front, never a link on the dashboard.

   Knowledge is THE TREE (db/067): folders, the way Lance pictures it ("like a folder or family tree"). Company, then Jake,
   Drew and Cora, then Cities and Kinds of project; every rule and page lives in one folder and is shown in a second one
   by a pointer. Only the live version is kept: an edit overwrites, Delete deletes (with an Undo beside it).

   Knowledge (db/066). Lance, 23 Nov 2026: "Is the team's knowledge base or learned rules or whatever available
   to me to view? I'd like to see it and be able to edit it myself. Could it be a page on P4 that I open and change there?"
   The whole base, opened the way it is filed (core/lessons.py structure): who it is for, subject, kind of drawing sheet,
   city and the other scopes, and the pages. What he changes here is his word and counts at once; nothing is deleted.
   Same look as the dashboard: Volcanic Black on a near-white backdrop, Jost only, one hairline, square corners, light only. */
:root {
  color-scheme: light only;
  --bg: #FCFBF9; --soft: #F4F2ED; --ink: #1B1B19; --muted: #6E695F; --rule: rgba(27, 27, 25, .2);
  --oak: #B2906B; --sage: #4F6B66; --long: #9A3B2E; --on-ink: #FCFBF9;
  --sans: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; border-radius: 0; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
a { color: inherit; text-decoration: none; }
#gate { padding: 60px 20px; text-align: center; }
#gate a, .back a, .part a { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
#wrap { max-width: 860px; margin: 0 auto; padding: 18px 18px 80px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.brand b { font-weight: 300; letter-spacing: .5em; font-size: 15px; text-transform: uppercase; }
.brand span, h2, form.edit label, button.go, .back { text-transform: uppercase; letter-spacing: .18em; font-weight: 400; font-size: .66rem; }
#find { margin-top: 14px; }
input, textarea, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); padding: 9px 10px; width: 100%; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input:focus, textarea:focus, select:focus { border-color: var(--ink); outline: none; }
textarea { display: block; resize: vertical; min-height: 90px; line-height: 1.45; }
h1 { font-weight: 400; font-size: 21px; line-height: 1.3; margin: 14px 0 2px; }
h2 { margin: 30px 0 0; padding-bottom: 7px; border-bottom: 1px solid var(--ink); }
.muted { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.back { margin: 18px 0 0; color: var(--muted); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list a { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
ul.list a span { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
ul.list a.none { color: var(--muted); }
ul.list small { display: block; color: var(--muted); font-size: 13px; }
@media (min-width: 700px) { ul.cols { columns: 2; column-gap: 40px; } ul.cols li { break-inside: avoid; } }
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
.top p { margin: 0; flex: 1 1 260px; }
button.go, a.go { color: var(--on-ink); background: var(--ink); border: 1px solid var(--ink); padding: 11px 20px; cursor: pointer; font-family: var(--sans); }
a.go { display: inline-block; text-transform: uppercase; letter-spacing: .18em; font-size: .66rem; white-space: nowrap; }
button.go:disabled { opacity: .45; cursor: default; }
button.text { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.narrow { display: flex; gap: 10px; margin-top: 12px; }
.rule { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.rule .t { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.rule .w, .rule .m, .rule .n { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.rule .m b { font-weight: 400; color: var(--ink); }
.rule.off .t { color: var(--muted); }
.acts { margin-top: 8px; display: flex; gap: 20px; font-size: 14px; }
form.edit { padding: 2px 0 4px; }
form.edit label { display: block; margin-top: 12px; color: var(--muted); }
form.edit label > * { margin-top: 5px; text-transform: none; letter-spacing: 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
.bar { margin-top: 14px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.msg { color: var(--long); font-size: 14px; }
.msg.ok { color: var(--sage); }
.part { padding: 4px 0 14px; border-bottom: 1px solid var(--rule); }
.part h3 { font-weight: 500; font-size: 16px; margin: 16px 0 6px; }
.part h3.l1 { font-weight: 400; font-size: 21px; } .part h3.l3 { font-size: 15.5px; }
.part .x { white-space: pre-wrap; overflow-wrap: anywhere; }
.part .acts { margin-top: 10px; }
.cut { margin: 26px 0 0; padding: 10px 12px; background: var(--soft); color: var(--muted); font-size: 13.5px; }
code { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: .9em; background: var(--soft); padding: 0 3px; }
.lnk { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.rule .m.pts { line-height: 2; }
.set { padding: 14px 0 4px; }
.set p { margin: 0 0 10px; }
.offscreen { position: absolute !important; left: -9999px; width: 1px !important; height: 1px; opacity: 0; }
#pwform { display: grid; gap: 8px; margin-top: 4px; max-width: 360px; }
#pwform .bar { margin-top: 6px; }
</style>

<body>
<div id="gate" hidden></div>
<div id="wrap" hidden>
  <header>
    <div class="brand"><a href="./" aria-label="Plansman: back to the dashboard"><b>Plansman</b></a><span><a href="#">Admin</a></span></div>
    <form id="find" role="search" hidden><input id="q" type="search" placeholder="Search the rules and pages" aria-label="Search the rules and pages" autocomplete="off"></form>
  </header>
  <main id="main"></main>
  </div>
<script>
(function () {
  var CFG = window.OFFICE || null, TOKEN_KEY = 'plansman_office_token', token = null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function day(iso) { if (!iso) return ''; var d = new Date(String(iso).length === 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? '' : d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function rpc(name, body) {
    return fetch(CFG.url + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function gate(html) { $('gate').innerHTML = html; $('gate').hidden = false; $('wrap').hidden = true; }
  // every read and write goes through the dashboard's sign-in; a sign-in that has ended says so once
  function call(name, body) {
    body.p_token = token;
    return rpc(name, body).then(function (d) {
      if (!d || !d.ok) { gate('Signed out. <a href="./">Open the dashboard</a> and sign in, then come back.'); throw new Error('signed out'); }
      return d;
    });
  }
  var main = $('main'), MAP = null, F = {}, KIDS = {}, RULES = {}, PAGE = null, seq = 0;
  var WHO = { everyone: 'Everyone', jake: 'Jake', drew: 'Drew', cora: 'Cora' };
  function names(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  // THE TREE (db/067). The base is folders: Company, then Jake, Drew and Cora, then Cities and Kinds of project. Every rule
  // and page lives in one folder; what belongs in two is shown in the other by a pointer and is still one record.
  function short(t) { return String(t || '').split(' · ')[0]; }
  function chain(path) { var a = []; while (path && F[path]) { a.unshift(short(F[path].title)); path = F[path].parent; } return a.join(' › '); }
  function fhref(path) { return '#f/' + String(path).split('/').map(encodeURIComponent).join('/'); }
  function source(r) {
    var lf = r.learned_from || '', d = day(r.said_on || r.decided_at || r.created_at);
    if (lf === 'old_bots') return 'Carried over from the old Jake, Cora and Drew';
    if (/_noticed$/.test(lf)) return '<b>Proposed by ' + esc(WHO[lf.replace('_noticed', '')] || lf) + ', approved by you</b>' + (d ? ', ' + d : '');
    if (lf === 'claude_suggestion') return '<b>Suggested in a build session, approved by you</b>' + (d ? ', ' + d : '');
    return '<b>Yours</b>' + (d ? ', ' + d : '');
  }
  function needMap(fresh) {
    if (MAP && !fresh) return Promise.resolve(MAP);
    return call('office_tree', {}).then(function (d) {
      MAP = d; F = {}; KIDS = {};
      d.folders.forEach(function (f) { F[f.path] = f; });
      d.folders.forEach(function (f) { (KIDS[f.parent || ''] = KIDS[f.parent || ''] || []).push(f); });
      Object.keys(KIDS).forEach(function (k) { KIDS[k].sort(function (a, b) { return a.ord - b.ord || a.title.localeCompare(b.title); }); });
      return d;
    });
  }
  function row(link, text, n, sub) {
    return '<li><a href="' + esc(link) + '"' + (n === 0 ? ' class="none"' : '') + '><div>' + esc(text) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>' + (n == null ? '' : '<span>' + n + '</span>') + '</a></li>';
  }
  function fail(err) { if (err && err.message === 'signed out') return; main.innerHTML = '<p class="back"><a href="#k">‹ Knowledge</a></p><p class="msg">Could not load (' + esc(err && err.message) + '). <button class="text" type="button" onclick="location.reload()">Try again</button></p>'; }

  // ---- the front of Admin: the settings, one section each ----
  var pw = { open: false, msg: '' };
  function showAdmin() {
    ++seq;
    var h = '<p class="back"><a href="./">‹ Dashboard</a></p><h1>Admin</h1>';
    h += '<h2>Knowledge</h2><ul class="list">' + row('#k', 'What the team knows', null, MAP ? MAP.active.toLocaleString('en-US') + ' rules and ' + MAP.pages + ' pages, in folders. Read them, search them, change them.' : 'Read it, search it, change it.') + '</ul>';
    // He changes his password himself: his current one, the new one twice. It is checked and kept (as a one-way hash)
    // by the record; this page never keeps it. Changing it signs his other devices out and keeps this one.
    h += '<h2>Password</h2><div class="set">' + (pw.open
      ? '<form id="pwform" autocomplete="on"><input class="offscreen" type="text" name="username" autocomplete="username" value="plansman" tabindex="-1" aria-hidden="true" readonly>' +
        '<input id="pw-cur" type="password" autocomplete="current-password" placeholder="Current password" aria-label="Current password">' +
        '<input id="pw-new" type="password" autocomplete="new-password" placeholder="New password, at least 8 characters" aria-label="New password">' +
        '<input id="pw-new2" type="password" autocomplete="new-password" placeholder="New password again" aria-label="New password again">' +
        '<div class="bar"><button class="go" type="submit">Save</button><button class="text" type="button" id="pw-cancel">Cancel</button></div>' +
        '<span class="muted" id="pw-msg" role="status">' + esc(pw.msg || 'A few words strung together is strong and easy to remember.') + '</span></form>'
      : (pw.msg ? '<p class="muted">' + esc(pw.msg) + '</p>' : '') + '<button class="text" type="button" id="pw">Change password</button>') + '</div>';
    h += '<h2>This device</h2><div class="set"><p class="muted">Signing out here leaves your other devices signed in.</p><button class="text" type="button" id="out">Sign out</button></div>';
    main.innerHTML = h;
    if (!MAP) needMap().then(function () { if (!location.hash.replace('#', '') && !pw.open) showAdmin(); }).catch(function () {});
  }
  function savePw() {
    var cur = $('pw-cur').value.trim(), a = $('pw-new').value.trim(), b = $('pw-new2').value.trim(), tell = function (m) { $('pw-msg').textContent = m; };
    if (!cur || !a) return tell('Fill in your current password and the new one.');
    if (a !== b) return tell('The two new ones are not the same.');
    tell('Saving…');
    rpc('office_set_password', { p_token: token, p_current: cur, p_new: a }).then(function (d) {
      if (d && d.ok && d.saved) { pw.open = false; pw.msg = 'Password changed. Your other devices are signed out; this one stays signed in.'; showAdmin(); }
      else tell(d && d.ok ? 'Not changed: ' + (d.why || 'try again') + '.' : 'Signed out. Open the dashboard and sign in again first.');
    }).catch(function (err) { tell('Not changed (' + err.message + ').'); });
  }
  function signOut() {
    var t = token; token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    rpc('office_logout', { p_token: t }).catch(function () {}).then(function () { location.href = './'; });
  }

  // ---- Knowledge: the top of the tree ----
  function showRoot() {
    var mine = ++seq;
    if (!MAP) main.innerHTML = '<p class="muted">Loading…</p>';
    needMap(true).then(function (m) {
      if (mine !== seq) return;
      main.innerHTML = '<p class="back"><a href="#">‹ Admin</a></p><h1>Knowledge</h1>' +
        '<p class="muted">' + m.active.toLocaleString('en-US') + ' rules and ' + m.pages + ' pages. Each one lives in one folder. What you change here counts at once.</p>' +
        '<ul class="list">' + (KIDS[''] || []).map(function (f) { return row(fhref(f.path), f.title, f.all, f.about); }).join('') + '</ul>';
    }).catch(fail);
  }

  // ---- one folder: its write-up, the folders inside it, the rules that live in it, and the rules shown in it ----
  function pageRow(p) {
    var af = (p.always_for || []).map(function (w) { return WHO[w] || w; });
    return row('#p/' + encodeURIComponent(p.slug), p.title || p.slug, null,
      (p.here ? '' : 'Lives in another folder and is shown here too. ') + (af.length ? 'Its working standard is always in front of ' + names(af) + '.' : 'Read when it is needed.'));
  }
  function showFolder(path) {
    var mine = ++seq;
    main.innerHTML = '<p class="muted">Loading…</p>';
    needMap(true).then(function () {
      var f = F[path];
      if (!f) { main.innerHTML = '<p class="back"><a href="#k">‹ Knowledge</a></p><p class="muted">There is no such folder.</p>'; return null; }
      return (f.n + f.shown) ? call('office_tree_rules', { p_folder: path }) : { rules: [], total: 0 };
    }).then(function (d) {
      if (!d || mine !== seq) return;
      var f = F[path], kids = KIDS[path] || [];
      RULES = {}; d.rules.forEach(function (r) { RULES[r.id] = r; });
      var own = d.rules.filter(function (r) { return !r.shown; }), shown = d.rules.filter(function (r) { return r.shown; });
      var h = '<p class="back"><a href="' + (f.parent ? fhref(f.parent) : '#k') + '">‹ ' + esc(f.parent ? short(F[f.parent].title) : 'Knowledge') + '</a></p><h1>' + esc(f.title) + '</h1>';
      if (f.about) h += '<p class="muted">' + esc(f.about) + '</p>';
      h += '<div class="top"><p class="muted">' + (f.all === f.n ? (f.n === 1 ? '1 rule' : f.n + ' rules') : f.n ? f.n + ' here, ' + f.all + ' with the folders inside' : f.all + ' in the folders inside') +
        (f.shown ? ', and ' + f.shown + ' shown from another folder' : '') + '.</p><a class="go" href="#new/' + esc(path) + '">Add a rule here</a></div>';
      if (f.pages.length) h += '<h2>The write-up</h2><ul class="list">' + f.pages.map(pageRow).join('') + '</ul>';
      if (kids.length) h += '<h2>Inside</h2><ul class="list' + (kids.length > 12 ? ' cols' : '') + '">' + kids.map(function (k) { return row(fhref(k.path), k.title, k.all ? k.all : (k.pages.length || k.shown ? null : 0), !k.all && k.pages.length ? 'Its write-up' : ''); }).join('') + '</ul>';
      if (own.length) h += '<h2>Rules · ' + own.length + '</h2>' + own.map(card).join('');
      if (shown.length) h += '<h2>Shown here from another folder · ' + shown.length + '</h2>' + shown.map(card).join('');
      if (!f.pages.length && !kids.length && !d.rules.length) h += '<p class="muted" style="margin-top:20px">Nothing is filed here yet.</p>';
      main.innerHTML = h;
    }).catch(fail);
  }
  function showSearch(q) {
    var mine = ++seq;
    main.innerHTML = '<p class="back"><a href="#k">‹ Knowledge</a></p><h1>Search: “' + esc(q) + '”</h1><p class="muted">Loading…</p>';
    needMap().then(function () { return call('office_tree_rules', { p_q: q }); }).then(function (d) {
      if (mine !== seq) return;
      RULES = {}; d.rules.forEach(function (r) { r.found = true; RULES[r.id] = r; });
      var h = '<p class="back"><a href="#k">‹ Knowledge</a></p><h1>Search: “' + esc(q) + '”</h1><p class="muted">' + (d.total === 1 ? '1 rule' : d.total + ' rules') +
        (d.total > d.rules.length ? ', the first ' + d.rules.length + ' shown' : '') + (d.pages.length ? ' and ' + (d.pages.length === 1 ? '1 page' : d.pages.length + ' pages') : '') + '.</p>';
      if (d.pages.length) h += '<h2>Pages that have these words</h2><ul class="list">' + d.pages.map(function (p) { return row('#p/' + encodeURIComponent(p.slug), p.title || p.slug, null); }).join('') + '</ul>';
      var groups = {}, order = [];
      d.rules.forEach(function (r) { var k = chain(r.folder) || 'Not filed'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(r); });
      order.sort().forEach(function (k) { h += '<h2>' + esc(k) + ' · ' + groups[k].length + '</h2>' + groups[k].map(card).join(''); });
      main.innerHTML = h;
    }).catch(fail);
  }
  function card(r) {
    var h = '<div class="rule' + (r.gone ? ' off' : '') + '" data-id="' + esc(r.id) + '"><p class="t">' + esc(r.rule) + '</p>';
    if (r.gone) {
      return h + '<p class="n">' + esc(r.said) + '</p><div class="acts">' + (r.gone === 'deleted' ? '<button class="text" type="button" data-do="undo">Undo</button>' : '<a class="lnk" href="' + fhref(r.folder) + '">Open that folder</a>') +
        '<span class="msg" role="status"></span></div></div>';
    }
    if (r.applies_when) h += '<p class="w">When: ' + esc(r.applies_when) + '</p>';
    var m = [source(r)];
    if (r.proj_no) m.push('Job ' + esc(r.proj_no));
    if (r.shown) m.unshift('Lives in <a class="lnk" href="' + fhref(r.folder) + '">' + esc(chain(r.folder)) + '</a>');
    h += '<p class="m">' + m.join(' · ') + '</p>';
    var links = (r.links || []).filter(function (p) { return F[p]; });
    if (links.length && !r.shown) h += '<p class="m">Also shown in ' + links.map(function (p) { return '<a class="lnk" href="' + fhref(p) + '">' + esc(chain(p)) + '</a>'; }).join(', ') + '</p>';
    if (r.said) h += '<p class="n">' + esc(r.said) + '</p>';
    return h + '<div class="acts"><button class="text" type="button" data-edit>Edit</button><button class="text" type="button" data-do="delete">Delete</button><span class="msg" role="status"></span></div></div>';
  }
  function folderOpts(cur) {
    var out = [];
    (function walk(parent, depth) {
      (KIDS[parent] || []).forEach(function (f) {
        out.push('<option value="' + esc(f.path) + '"' + (f.path === cur ? ' selected' : '') + '>' + new Array(depth + 1).join('   ') + esc(short(f.title)) + '</option>');
        walk(f.path, depth + 1);
      });
    })('', 0);
    return out.join('');
  }
  function ptsHtml(r) {
    var links = (r.links || []).filter(function (p) { return F[p]; });
    return links.map(function (p) { return esc(chain(p)) + ' <button class="text" type="button" data-unlink="' + esc(p) + '">Remove</button>'; }).join('<br>');
  }
  function form(r) {
    return '<form class="edit" data-form="' + esc(r.id || 'new') + '">' +
      '<label>The rule<textarea name="rule" rows="4" maxlength="2000" required>' + esc(r.rule || '') + '</textarea></label>' +
      '<label>When it applies<input name="when" maxlength="400" value="' + esc(r.applies_when || '') + '" placeholder="Leave empty if it always applies"></label>' +
      '<label>The folder it lives in<select name="folder">' + folderOpts(r.folder) + '</select></label>' +
      (r.id ? '<label>Also show it in<select name="link"><option value="">Pick a second folder…</option>' + folderOpts('') + '</select></label><p class="m pts">' + ptsHtml(r) + '</p>' : '') +
      '<div class="bar"><button class="go" type="submit">Save</button><button class="text" type="button" data-cancel>Cancel</button><span class="msg" role="status"></span></div></form>';
  }
  function grow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, Math.round(window.innerHeight * .7)) + 'px'; }
  function showNew(path) {
    ++seq;
    needMap().then(function () {
      main.innerHTML = '<p class="back"><a href="' + (F[path] ? fhref(path) : '#k') + '">‹ ' + esc(F[path] ? short(F[path].title) : 'Knowledge') + '</a></p><h1>Add a rule</h1>' +
        '<p class="muted">It is your rule from the moment you save it: whoever the folder belongs to has it in front of them at their next run.</p>' + form({ folder: path });
      var t = main.querySelector('textarea'); if (t) t.focus();
    }).catch(fail);
  }
  function redraw(id) { var el = main.querySelector('.rule[data-id="' + id + '"]'); if (el && RULES[id]) el.outerHTML = card(RULES[id]); }
  function say(el, text, ok) { var m = el && el.querySelector('.msg'); if (m) { m.textContent = text || ''; m.className = 'msg' + (ok ? ' ok' : ''); } }
  function saveRule(f) {
    var id = f.getAttribute('data-form'), isNew = id === 'new', v = function (n) { return (f.elements[n].value || '').trim(); }, btn = f.querySelector('button.go'), folder = v('folder');
    btn.disabled = true; say(f, 'Saving…', true);
    call('office_tree_rule', { p_id: isNew ? null : id, p_action: isNew ? 'add' : 'save', p_rule: v('rule'), p_when: v('when'), p_folder: folder }).then(function (d) {
      if (!d.saved) { btn.disabled = false; say(f, d.why || 'Not saved. Try again.'); return; }
      if (isNew) { location.hash = fhref(folder); return; }
      var r = RULES[id], moved = r.folder !== folder;
      r.rule = v('rule'); r.applies_when = v('when'); r.folder = folder;
      if (moved && !r.shown && !r.found) { r.gone = 'moved'; r.said = 'Moved to ' + chain(folder) + '.'; }
      else r.said = moved ? 'Saved, and moved to ' + chain(folder) + '.' : 'Saved. The team has it at their next run.';
      redraw(id);
      needMap(true).catch(function () {});
    }).catch(function (err) { btn.disabled = false; if (err.message !== 'signed out') say(f, 'Not saved (' + err.message + '). Your words are still here.'); });
  }
  // Delete is at once, with an Undo beside it: only the live version is kept (Lance, 23 Nov 2026: "just update rules as
  // needed so we just have the live version"), and the way back from a slip of the thumb is the Undo, not a question first.
  function act(id, what, el) {
    say(el, what === 'delete' ? 'Deleting…' : 'Bringing it back…', true);
    call('office_tree_rule', { p_id: id, p_action: what }).then(function (d) {
      var r = RULES[id]; if (!r) return;
      if (!d.saved) { say(el, d.why || 'Not done. Try again.'); var b = el.querySelector('[data-do]'); if (b) b.disabled = false; return; }
      if (what === 'delete') { r.gone = 'deleted'; r.said = 'Deleted. The team stops using it at their next run.'; }
      else { delete r.gone; r.said = 'Back in the base.'; }
      redraw(id);
    }).catch(function (err) { if (err.message !== 'signed out') say(el, 'Not done (' + err.message + ').'); });
  }
  function point(f, path, add) {
    var id = f.getAttribute('data-form'), r = RULES[id];
    call('office_tree_rule', { p_id: id, p_action: add ? 'link' : 'unlink', p_folder: path }).then(function (d) {
      if (!d.saved) { say(f, d.why || 'Not done.'); return; }
      r.links = (r.links || []).filter(function (p) { return p !== path; });
      if (add && path !== r.folder) r.links.push(path);
      f.querySelector('.pts').innerHTML = ptsHtml(r);
      say(f, add ? 'It is shown in ' + chain(path) + ' as well.' : 'No longer shown in ' + chain(path) + '.', true);
    }).catch(function (err) { if (err.message !== 'signed out') say(f, 'Not done (' + err.message + ').'); });
  }

  // ---- one page, a part at a time ----
  function split(body) {
    var starts = [0], re = /^#{1,3} .*$/gm, m;
    while ((m = re.exec(body))) if (m.index > 0) starts.push(m.index);
    return starts.map(function (s, i) { return body.slice(s, i + 1 < starts.length ? starts[i + 1] : body.length); }).filter(function (p) { return p.length; });
  }
  // the end of a part that is kept as it is: blank lines, and the line of dashes before the earlier notes
  function tail(raw) { return (/(\s*\n---[ \t]*\s*|\s*)$/.exec(raw) || [''])[0]; }
  function fmt(text) {
    // the pages are written with a line break every 115 characters or so: a paragraph is joined back up so it wraps to
    // the screen; a blank line, a list item, a table row, a heading or a quote still starts on its own line
    return esc(text.replace(/\n(?![ \t]*(\n|[-*] |\d+\. |\||#|>|```))[ \t]*/g, ' '))
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>');
  }
  var EARLIER = '## Earlier notes on the same subject';
  function partHtml(raw, i) {
    var shown = raw.slice(0, raw.length - tail(raw).length), m = /^(#{1,3}) (.*)(\n|$)/.exec(shown), h = '';
    if (m && m[0].indexOf(EARLIER) === 0) h += '<p class="cut">From here down are the earlier notes. The team looks them up when the working standard above is silent; they are not printed in front of anyone.</p>';
    h += '<div class="part" data-part="' + i + '">';
    if (m) h += '<h3 class="l' + m[1].length + '">' + fmt(m[2]) + '</h3>';
    var text = (m ? shown.slice(m[0].length) : shown).replace(/^\n+/, '');
    if (text) h += '<div class="x">' + fmt(text) + '</div>';
    return h + '<div class="acts"><button class="text" type="button" data-part-edit>Edit this part</button><span class="msg" role="status"></span></div></div>';
  }
  function drawPage(note) {
    var p = PAGE, af = (p.always_for || []).map(function (w) { return WHO[w] || w; }), f = F[p.folder];
    p.parts = split(p.body);
    main.innerHTML = '<p class="back"><a href="' + (f ? fhref(f.path) : '#k') + '">‹ ' + esc(f ? short(f.title) : 'Knowledge') + '</a></p>' +
      '<p class="muted">' + (af.length ? 'The working standard at the top of this page is printed in front of ' + names(af) + ' at every run.' : 'The team reads this page when it is needed.') +
      (p.updated_at ? ' Last changed ' + day(p.updated_at) + '.' : '') + '</p>' + (note ? '<p class="msg">' + esc(note) + '</p>' : '') +
      p.parts.map(partHtml).join('');
  }
  function showPage(slug) {
    var mine = ++seq;
    main.innerHTML = '<p class="back"><a href="#k">‹ Knowledge</a></p><p class="muted">Loading…</p>';
    needMap().then(function () { return call('office_knowledge_page', { p_slug: slug }); }).then(function (d) {
      if (mine !== seq) return;
      if (!d.page) { main.innerHTML = '<p class="back"><a href="#k">‹ Knowledge</a></p><p class="muted">There is no such page.</p>'; return; }
      PAGE = d.page; drawPage();
    }).catch(fail);
  }
  function editPart(el) {
    var i = +el.getAttribute('data-part'), raw = PAGE.parts[i], shown = raw.slice(0, raw.length - tail(raw).length);
    el.innerHTML = '<form class="edit" data-part-form="' + i + '"><label>This part, as it is written<textarea name="text" rows="8">' + esc(shown) + '</textarea></label>' +
      '<div class="bar"><button class="go" type="submit">Save</button><button class="text" type="button" data-part-cancel>Cancel</button><span class="msg" role="status"></span></div></form>';
    var t = el.querySelector('textarea'); grow(t); t.focus();
  }
  function savePart(f) {
    var i = +f.getAttribute('data-part-form'), raw = PAGE.parts[i], btn = f.querySelector('button.go');
    var text = f.elements.text.value.replace(/\s+$/, ''), next = text ? text + tail(raw) : (/---/.test(tail(raw)) ? tail(raw) : '');
    if (next === raw) { drawPage(); return; }
    btn.disabled = true; say(f, 'Saving…', true);
    var y = window.scrollY;
    call('office_knowledge_page_save', { p_slug: PAGE.slug, p_old: raw, p_new: next }).then(function (d) {
      if (d.body) PAGE.body = d.body;
      if (d.saved) { PAGE.updated_at = new Date().toISOString(); drawPage(); window.scrollTo(0, y); return; }
      if (d.changed) { drawPage(d.why); window.scrollTo(0, 0); return; }
      btn.disabled = false; say(f, d.why || 'Not saved. Try again.');
    }).catch(function (err) { btn.disabled = false; if (err.message !== 'signed out') say(f, 'Not saved (' + err.message + '). Your words are still here.'); });
  }

  // ---- what is on the page follows the address, so Back works ----
  // "" the front of Admin · "k" the top of the tree · "f/<folder>" a folder · "q/<words>" a search · "p/<page>" a page · "new/<folder>" a new rule
  function route() {
    var h = (location.hash || '').replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) {}
    window.scrollTo(0, 0);
    $('find').hidden = !h;                                 // the search is Knowledge's; the front of Admin has none
    if (!h) { showAdmin(); return; }
    if (h.indexOf('q/') === 0) { $('q').value = h.slice(2); showSearch(h.slice(2)); return; }
    $('q').value = '';
    if (h.indexOf('p/') === 0) { showPage(h.slice(2)); return; }
    if (h.indexOf('new/') === 0) { showNew(h.slice(4)); return; }
    if (h.indexOf('f/') === 0) { showFolder(h.slice(2)); return; }
    showRoot();
  }
  if (!CFG) { gate('This page works on plansman.ai.'); return; }
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!token) { gate('<a href="./">Open the dashboard</a> and sign in, then come back.'); return; }
  $('wrap').hidden = false;
  $('find').addEventListener('submit', function (e) { e.preventDefault(); var q = $('q').value.trim(); $('q').blur(); location.hash = q ? '#q/' + encodeURIComponent(q) : '#k'; });
  main.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
    if (b.id === 'pw') { pw.open = true; pw.msg = ''; showAdmin(); $('pw-cur').focus(); return; }
    if (b.id === 'pw-cancel') { pw.open = false; pw.msg = ''; showAdmin(); return; }
    if (b.id === 'out') { b.disabled = true; signOut(); return; }
    var rule = b.closest('.rule'), part = b.closest('.part');
    if (b.hasAttribute('data-unlink')) { point(b.closest('form'), b.getAttribute('data-unlink'), false); return; }
    if (b.hasAttribute('data-edit') && rule) { rule.innerHTML = form(RULES[rule.getAttribute('data-id')]); grow(rule.querySelector('textarea')); return; }
    if (b.hasAttribute('data-do') && rule) { b.disabled = true; act(rule.getAttribute('data-id'), b.getAttribute('data-do'), rule); return; }
    if (b.hasAttribute('data-cancel')) { if (rule) redraw(rule.getAttribute('data-id')); else history.back(); return; }
    if (b.hasAttribute('data-part-edit') && part) { editPart(part); return; }
    if (b.hasAttribute('data-part-cancel')) { var y = window.scrollY; drawPage(); window.scrollTo(0, y); }
  });
  main.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'pwform') savePw(); else if (f.hasAttribute('data-form')) saveRule(f); else if (f.hasAttribute('data-part-form')) savePart(f);
  });
  main.addEventListener('change', function (e) {
    var t = e.target; if (t.name !== 'link' || !t.value) return;
    var path = t.value; t.value = ''; point(t.closest('form'), path, true);
  });
  main.addEventListener('input', function (e) { if (e.target.tagName === 'TEXTAREA') grow(e.target); });
  window.addEventListener('hashchange', route);
  route();
  // a new build of the page takes over by itself, but never while he is writing
  setInterval(function () {
    if (document.hidden || main.querySelector('form.edit, #pwform')) return;
    fetch('version.json?' + Date.now()).then(function (r) { return r.json(); }).then(function (v) { if (v && v.build && v.build !== window.BUILD) location.reload(); }).catch(function () {});
  }, 60000);
})();
</script>
