<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Plansman Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P4"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* The look follows Lance's design brief for the high-end wing (19 Nov 2026): quiet, editorial, precise.
   Colour   Volcanic Black #1B1B19 on a backdrop a step lighter and less cream than the brief's Plaster White
            (#FCFBF9, at his word: "a little lighter not so creamy"); a pale Limestone for the selected row;
            Weathered Oak #B2906B and Pacific Sage #4F6B66 as the two sparing accents. Never pure white.
            Light only: there is no dark mode ("i dont like darkmode so abandon that").
   Type     Jost: thin, wide-tracked capitals for the brand, headings and labels; regular weight for working
            text. One family only (Lance, 19 Nov 2026: "the amount of fonts on this screen is obnoxious"): no serif. Nothing heavier
            than 500.
   Line     one hairline weight for every rule, border and frame; square corners; flat; no shadows.
   Signature details from the logo work: thin square frames (the phase path's markers, the timer tags), a
            single horizontal line as a horizon (the phase path), title-block metadata (the facts under the
            address are set as a drawing title block).
   Where this departs from the brief, on purpose, because it is a working queue:
     - one colour the brief does not have, a muted red (--long), so a long wait can be told from an oak one
     - a 3px colour edge on each row: the single non-hairline element, the fastest thing to scan
     - working text stays at regular weight and full black; light type is kept for headings
   Layout: one column on a phone (list, then a project page); two panes side by side on a wide screen. */
:root {
  color-scheme: light only;      /* no dark mode: Lance does not like it */
  --bg: #FCFBF9; --soft: #F4F2ED; --sand: #ECE8DE; --bar: #E7E5E0; --ink: #1B1B19; --muted: #6E695F; --rule: rgba(27, 27, 25, .2);
  --oak: #B2906B; --oak-ink: #7A5E3C; --sage: #4F6B66; --long: #9A3B2E;
  --new-bg: rgba(79, 107, 102, .11); --old-bg: rgba(178, 144, 107, .17); --long-bg: rgba(154, 59, 46, .1);
  --on-ink: #FCFBF9; --surface: #FCFBF9; --line: var(--rule); --late: var(--long); --ok-ink: var(--sage);
  --sans: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; border-radius: 0; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; padding-block: 22px 56px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.shell { max-width: 1360px; margin: 0 auto; display: grid; gap: 24px; }
.pane { min-width: 0; }
/* small, wide-spaced capitals: every label on the page */
h2, .sec h3, .below, .eyebrow, .fact .k, .draft .lbl, .nav a, .city, .pathlab span, .ph, .bub, button.go, .marks button.text, .back, h2 .n, .key {
  font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-weight: 400; }
h2, .sec h3, .below, .eyebrow, .fact .k, .draft .lbl, .nav a, .city { font-size: .66rem; color: var(--muted); }
button.go { font-size: .7rem; color: var(--on-ink); background: var(--ink); border: 1px solid var(--ink); padding: 12px 20px; cursor: pointer; }
@media (hover: hover) { button.go:hover { background: transparent; color: var(--ink); } }
button.go:disabled { opacity: .45; cursor: default; }
a.go.drafting { display: inline-block; font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-size: .7rem; color: var(--ink);
  border: 1px solid var(--ink); padding: 12px 20px; }
@media (hover: hover) { a.go.drafting:hover { background: var(--ink); color: var(--on-ink); } }
button.text { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
input, textarea { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--rule); }
input:focus, textarea:focus { border-color: var(--ink); outline: none; }
::placeholder { color: var(--muted); }

/* sign in */
#login { max-width: 340px; margin: 18vh auto 0; display: grid; gap: 16px; }
#login b, .brand b { font-weight: 300; letter-spacing: .5em; font-size: 15px; text-transform: uppercase; }
#login p { margin: 0; color: var(--muted); }
#login input { width: 100%; padding: 12px; font-size: 20px; letter-spacing: .3em; }
#login .err { color: var(--long); min-height: 1.4em; font-size: 14px; }

/* list pane */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.brand span { color: var(--muted); font-size: 12px; text-align: right; }
#notify { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--rule); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#notify span { flex: 1; min-width: 180px; font-size: 14px; color: var(--muted); }
#notice { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--long); color: var(--long); font-size: 15.5px; }
#q { width: 100%; margin-top: 16px; padding: 12px 13px; }
/* the Chat page: the general conversation with Jake, newest at the bottom, the box under it */
#chatview { margin-top: 18px; }
#chatlog { min-height: 30vh; }
#chatlog .empty { color: var(--muted); text-align: center; margin: 12vh 0; }
#chatlog .msg a.open { display: inline-block; margin-top: 8px; font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-size: .6rem;
  border: 1px solid var(--ink); padding: 7px 11px 6px 12px; }
#chatlog .msg b { font-weight: 500; }
#ask { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 max(10px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); }
#ask-text { width: 100%; min-height: 58px; max-height: 40vh; resize: none; padding: 10px 11px; display: block; }
#ask .bar { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
#ask .bar span { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
#pend-btn, #job-pend { margin-left: auto; white-space: nowrap; background: none; color: var(--ink); border: 1px solid var(--ink); padding: 11px 14px; cursor: pointer;
  font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-size: .66rem; }
#pend-btn[aria-pressed="true"], #job-pend[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
#chatlog .msg.pend { border-color: var(--ink); border-left: 3px solid var(--oak); }
#chatlog .msg .item { padding: 0; }
#chatlog .msg .item .head span { display: none; }
#chatlog .msg .item .head b { font-weight: 400; font-size: 15.5px; }
#chatlog .msg .item .body { color: var(--ink); font-size: 14.5px; margin-top: 5px; }
#chatlog .msg .answer textarea { width: 100%; min-height: 56px; margin-top: 10px; padding: 10px 11px; }
#pullbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 0 10px; background: var(--ink); color: var(--on-ink);
  font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-size: .62rem; transform: translateY(-100%); transition: transform .15s ease-out; pointer-events: none; }
#pullbar.show { transform: none; }
#chat-dot { display: inline-block; width: 7px; height: 7px; background: var(--long); margin-left: 7px; vertical-align: 2px; font-style: normal; }
/* with a number: that many things in the Chat thread wait on him (Lance, 22 Nov 2026: "the badge should show on it that there's something to resolve") */
#chat-dot.n { width: auto; height: auto; min-width: 18px; padding: 2px 5px 1px; color: #fff; font-size: .62rem; letter-spacing: .04em; line-height: 1.3; text-align: center; vertical-align: 1px; }
@keyframes slideL { from { transform: translateX(32px); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-32px); opacity: .2; } to { transform: none; opacity: 1; } }
.slide-l { animation: slideL .2s ease-out; } .slide-r { animation: slideR .2s ease-out; }
.msg .item .rule, .need .item .rule { font-size: 15.5px; }
.nav { display: flex; gap: 26px; margin-top: 22px; border-bottom: 1px solid var(--rule); }
.nav a { padding: 8px 0 11px; border-bottom: 1px solid transparent; margin-bottom: -1px; }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
h2 { margin: 30px 0 0; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; color: var(--ink); }
h2 .n { background: var(--ink); color: var(--on-ink); font-size: .64rem; letter-spacing: .08em; padding: 2px 7px 1px; font-variant-numeric: tabular-nums; }
h2 small { flex-basis: 100%; font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--muted); }
.dist { display: flex; height: 3px; margin-top: 12px; background: var(--rule); }
.dist i { display: block; height: 100%; }
.dist .r, .key .r::before { background: var(--long); } .dist .a, .key .a::before { background: var(--oak); } .dist .g, .key .g::before { background: var(--sage); }
.key { display: flex; gap: 16px; margin-top: 8px; font-size: .62rem; letter-spacing: .14em; color: var(--muted); font-variant-numeric: tabular-nums; }
.key span::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; }
.rows { display: grid; margin-top: 12px; border: 1px solid var(--rule); }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; padding: 14px 14px 14px 18px; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.row.sr::before, .need > .item.sr::before { background: var(--long); }
.row.sa::before, .need > .item.sa::before { background: var(--oak); }
.row.sg::before, .need > .item.sg::before { background: var(--sage); }
@media (hover: hover) { .row:hover { background: var(--soft); } }
.row[aria-current="true"] { background: var(--sand); }
.row .addr { font-weight: 400; font-size: 16.5px; line-height: 1.3; overflow-wrap: anywhere; }
.no { color: var(--muted); font-size: .68rem; letter-spacing: .14em; margin-right: 10px; font-variant-numeric: tabular-nums; vertical-align: 1px; }
.ph { display: inline-block; font-size: .6rem; line-height: 1.6; padding: 2px 7px 1px 8px; margin-right: 9px; vertical-align: 1px;
      background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); white-space: nowrap; }
.ph.c-city { background: transparent; color: var(--sage); border-color: var(--sage); }
.ph.c-client { background: transparent; color: var(--oak-ink); border-color: var(--oak); }
.ph.c-lead, .ph.c-unknown, .ph.c-done { background: transparent; color: var(--muted); border-color: var(--rule); }
.bubs { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; padding-top: 1px; }
.bub { display: inline-block; font-size: .62rem; letter-spacing: .12em; line-height: 1.6; padding: 3px 8px 2px 9px; border: 1px solid; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bub.g { background: var(--new-bg); color: var(--sage); border-color: var(--sage); }
.bub.a { background: var(--old-bg); color: var(--oak-ink); border-color: var(--oak); }
.bub.r { background: var(--long-bg); color: var(--long); border-color: var(--long); }
.row .when { color: var(--muted); font-size: 12.5px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 3px; }
.row .when.late { color: var(--long); }
.row .what { grid-column: 1 / -1; margin-top: 8px; color: var(--muted); font-size: 14.5px; overflow-wrap: anywhere;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { color: var(--muted); padding: 16px 18px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 30px; }

/* project page */
.back { display: inline-block; font-size: .66rem; padding: 4px 0 14px; }
.sheet { border: 1px solid var(--rule); padding: 24px 18px 12px; }
.eyebrow { margin-bottom: 14px; }
.sheet h1 { margin: 0; font-family: var(--sans); font-weight: 400; text-transform: uppercase; letter-spacing: .14em; font-size: clamp(1.45rem, 2.9vw, 2.25rem); line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.city { margin-top: 10px; font-size: .72rem; letter-spacing: .22em; }
/* the phases as a horizon line with square markers: filled = passed, framed = where it is, open = ahead */
.path, .pathlab { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.path { position: relative; margin-top: 30px; align-items: center; height: 15px; }
.path::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; border-top: 1px solid var(--rule); }
.path i { position: relative; width: 7px; height: 7px; border: 1px solid var(--ink); background: var(--bg); }
.path i.was { background: var(--ink); }
.path i.now { width: 7px; height: 7px; background: var(--ink); outline: 1px solid var(--ink); outline-offset: 3px; margin-left: 4px; }
.pathlab { margin-top: 10px; }
.pathlab span { font-size: .56rem; letter-spacing: .12em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
.pathlab span.now { color: var(--ink); font-weight: 500; }
.pathnow { display: none; margin-top: 12px; font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pathnow b { color: var(--ink); font-weight: 500; }
/* the key facts, set as a drawing title block */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin-top: 26px; background: var(--rule); border: 1px solid var(--ink); }
.fact { background: var(--bg); padding: 10px 12px 12px; min-height: 64px; }
.fact .k { font-size: .56rem; letter-spacing: .2em; }
.fact .v { margin-top: 7px; font-size: 15.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fact .v .bubs { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; }
.fact .v .ph { margin: 0; }
.fact { min-width: 0; }
.fact .v .bub { font-size: .56rem; letter-spacing: .08em; padding: 3px 6px 2px 7px; }
.sheet h1 .hno { margin-right: .55em; white-space: nowrap; }
.status { margin: 22px 0 6px; font-family: var(--serif); font-weight: 500; font-size: 1.36rem; line-height: 1.35; overflow-wrap: anywhere; max-width: 44rem; }
.sec { padding: 22px 0 18px; border-top: 1px solid var(--rule); margin-top: 8px; }
.sec h3 { margin: 0 0 12px; }
/* Jake / Drew / Cora: one bar, pinned at the top of a job, the same on all three (Lance, 22 Nov 2026) */
.teambar { position: sticky; top: 0; z-index: 20; display: flex; gap: 8px; padding: 10px 0; background: var(--bg); font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; }
.teambar span, .teambar a { flex: 1; text-align: center; padding: 12px 8px 11px; border: 1px solid var(--ink); color: var(--ink); font-size: .7rem; text-decoration: none; position: relative; }
.teambar span.on { background: var(--rule); border-color: var(--rule); }
.teambar .badge { display: inline-block; min-width: 18px; margin-left: 8px; padding: 2px 5px 1px; background: var(--long); color: #fff; font-style: normal; font-size: .62rem; letter-spacing: .04em; line-height: 1.3; text-align: center; }
/* how many things Drew or Cora has waiting on him, on the button that opens that one's window */
.sec.tell .chat { margin-top: 4px; }
/* one thread per job: what waits on him sits in it as an item, between the messages */
.chat.need > .item { margin-top: 0; background: var(--bg, transparent); }
.chat.need > .cleared { margin-top: 0; }
.sectog.histog { margin: 10px 0 0; padding: 8px 0; color: var(--muted); font-size: 13.5px; }
.sec.lead h3 { color: var(--ink); }
.tl .gist { color: var(--ink); font-size: 14px; margin-top: 2px; }
.tl.tap { cursor: pointer; }
#mail-q { width: 100%; padding: 10px 11px; margin-bottom: 6px; font-size: 16px; }
.mailbody { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--rule); background: var(--soft); font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; cursor: text; }
.mailbody a.open, .reach a { font-family: var(--sans); text-transform: uppercase; letter-spacing: .16em; font-size: .6rem; border: 1px solid var(--ink); padding: 6px 10px 5px 11px; display: inline-block; }
.reach { margin-top: 8px; display: grid; gap: 8px; }
.reach .tel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.reach .tel b { font-weight: 400; font-variant-numeric: tabular-nums; margin-right: 4px; }
.reach a.mailto { text-transform: none; letter-spacing: 0; font-size: 14.5px; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; overflow-wrap: anywhere; }
.marks.slim { margin-top: 6px; } .marks.slim button.text { padding: 5px 10px 4px 11px; }
.pedit { display: grid; gap: 10px; } .pedit label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.pedit input, .pedit textarea { padding: 10px 11px; font-size: 16px; width: 100%; font-family: inherit; }
.pf { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.prow { display: flex; gap: 6px; align-items: stretch; }
.prow input { flex: 1; min-width: 0; }
.prow button.x { flex: none; width: 44px; background: none; border: 1px solid var(--rule); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.pedit button.add { justify-self: start; background: none; border: 0; padding: 6px 0; font-family: var(--sans); text-transform: uppercase; letter-spacing: .16em; font-size: .62rem; color: var(--ink); cursor: pointer; }
.pmore { display: flex; gap: 20px; flex-wrap: wrap; }
.item.person .head .role { white-space: normal; text-align: right; max-width: 58%; }
.pfoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.pfoot .pleft { flex: 1; min-width: 0; }
.pfoot .marks.slim { flex: none; margin: 6px 0 0; }
.item .body.pnote { margin-top: 8px; white-space: pre-wrap; }
/* a text as it was written (Lance, 21 Nov 2026: "show me exactly what they say") */
.item .words { margin: 8px 0 4px; border-left: 2px solid var(--ink); padding: 2px 0 2px 12px; }
.item .words p { margin: 0 0 8px; font-size: 15.5px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.item .words p:last-child { margin-bottom: 0; }
.item .words p.out { color: var(--muted); }
.item .words p i { display: block; font-style: normal; font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
.pask { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--ink); }
.pask p { margin: 0; font-size: 15.5px; }
.sectog { background: none; border: 0; padding: 6px 0; margin: -6px 0; width: 100%; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; text-align: left; }
.sectog i { font-style: normal; font-size: 1rem; letter-spacing: 0; color: var(--muted); padding-left: 12px; }
.sec.shut { padding-bottom: 14px; } .sec.shut h3 { margin-bottom: 0; }
.sec p { margin: 0 0 6px; overflow-wrap: anywhere; }
.below { margin: 16px 0 0; padding-top: 18px; border-top: 1px solid var(--ink); color: var(--ink); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 14px; font-variant-numeric: tabular-nums; }
.kv .k { color: var(--muted); }
.kv .v { text-align: right; overflow-wrap: anywhere; }
.kv .total { font-weight: 500; border-top: 1px solid var(--rule); padding-top: 7px; }
.note { color: var(--muted); font-size: 14px; }
.late { color: var(--long); }
.item { padding: 10px 0; }
.item + .item { border-top: 1px solid var(--rule); }
.item .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.item .head b { font-weight: 500; }
/* the date and time on every Needs you item (Lance, 22 Nov 2026: "hard to tell what's current or outdated") */
.item .when { font-family: var(--sans); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 2px 0 4px; }
.item .head span { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .head span.bub { font-size: .62rem; }
.item .head span.bub.g { color: var(--sage); } .item .head span.bub.a { color: var(--oak-ink); } .item .head span.bub.r { color: var(--long); }
.item .body { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.item .body + .body { margin-top: 5px; }
.item .body b { font-weight: 500; color: var(--ink); }
/* the things waiting on him: each in its own thin frame, its wait down the left edge */
.need > .item { position: relative; margin-top: 10px; padding: 14px 14px 14px 20px; border: 1px solid var(--rule); }

  function answerQuestion(qid) {

    if (!text) return;
    rpc('office_answer', { p_token: token, p_id: qid, p_text: text }).then(function (d) {
      if (d && d.ok && d.saved) {
        ASKS.questions.forEach(function (q) { if (q.id === qid) { q.state = 'answered'; q.answer = text; q.answered_at = new Date().toISOString(); } });
        delete state.ans[qid]; state.ansMsg = ''; setTimeout(loadAsks, 45000);
      } else { state.ansMsg = d && d.ok ? 'Not saved: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN; your answer is still here.'; }
      render();
    }).catch(function (e) { state.ansMsg = 'Not saved (' + e.message + '). Your answer is still here.'; render(); });
  }
  // Handled / Not my move / Put back: shown at once, saved to the record; put right again if the save fails
  function mark(no, key, what, who) {
    var before = MARKS[key];
    if (what === 'open') delete MARKS[key]; else MARKS[key] = { mark: what, waiting_on: who || null, marked_at: new Date().toISOString() };
    state.pick = null; state.markMsg = ''; render();
    rpc('office_mark', { p_token: token, p_proj: no, p_key: key, p_mark: what, p_who: who || null }).then(function (d) {
      if (d && d.ok && d.saved) return;
      if (before) MARKS[key] = before; else delete MARKS[key];
      state.markMsg = d && d.ok ? 'Not saved: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN.'; render();
    }).catch(function (e) {
      if (before) MARKS[key] = before; else delete MARKS[key];
      state.markMsg = 'Not saved (' + e.message + ').'; render();
    });
  }
  function tell(no) {
    var text = (state.draft[no] || '').trim();
    if (!text || state.sending) return;
    state.sending = true; render();
    rpc('office_tell', { p_token: token, p_proj: no, p_text: text }).then(function (d) {
      state.sending = false;
      if (!d || !d.ok) { state.tellMsg = 'Signed out. Reload and enter the PIN; your text is still here.'; }
      else if (!d.saved) { state.tellMsg = 'Not saved: ' + (d.why || 'unknown reason') + '.'; }
      else { SAID.unshift(d.instruction); state.draft[no] = ''; state.tellMsg = 'Sent to Jake. The answer appears here, usually within a minute.'; watchReplies(); }
      render();
    }).catch(function (e) { state.sending = false; state.tellMsg = 'Not saved (' + e.message + '). Your text is still here.'; render(); });
  }
  // People on a job, edited by him: the whole contact, what they are on this job, or off the job. Saved as HIS, so
  // neither the rebuild nor Jake changes it back, and written to his Google Contacts (db/037, db/042). A number or
  // address he adds that another contact already has: the same name is joined at once, another name is asked.
  // The page's data is re-read every so often from the published copy, which is a little behind the record. What he
  // just saved about a person is laid over it for five minutes, so a save never appears to undo itself.
  var KEPT = [];
  function keepPeople() {
    var now = Date.now();
    KEPT = KEPT.filter(function (k) { return k.until > now; });
    KEPT.forEach(function (k) {
      var p = BY[k.no]; if (!p) return;
      if (k.gone) { p.people = p.people.filter(function (y) { return y.id !== k.id; }); return; }
      var x = p.people.filter(function (y) { return y.id === k.id; })[0]; if (!x) return;
      Object.keys(k.set).forEach(function (f) { x[f] = k.set[f]; });
      if (k.joined.length) p.people = p.people.filter(function (y) { return y === x || k.joined.indexOf(y.name) < 0; });
    });
  }
  function keepPerson(p, x, gone, joined) {
    KEPT = KEPT.filter(function (k) { return !(k.no === p.no && k.id === x.id); });
    KEPT.push({ no: p.no, id: x.id, gone: gone, joined: joined || [], until: Date.now() + 300000, set: JSON.parse(JSON.stringify(
      { name: x.name, role: x.role, company: x.company, phones: x.phones, emails: x.emails, websites: x.websites, addresses: x.addresses, note: x.note })) });
  }
  function personDo(p, id, verb, other) {
    var x = p.people.filter(function (y) { return y.id === id; })[0];
    if (!x) return;
    if (verb === 'edit') {
      var f0 = { name: x.name, company: x.company || '', role: x.role || '', phones: (x.phones || []).map(pretty), emails: (x.emails || []).slice(),
        websites: (x.websites || []).slice(), addresses: (x.addresses || []).slice(), note: x.note || '', hasNote: !!x.note };
      if (!f0.phones.length) f0.phones.push('');
      if (!f0.emails.length) f0.emails.push('');
      state.editPerson = id; state.personForm = f0; state.personMsg = ''; state.personAsk = null; render(); return;
    }
    if (verb === 'cancel') { state.editPerson = null; render(); return; }
    if (verb === 'apart') {
      var rest = state.personAsk ? state.personAsk.others.filter(function (o) { return o.id !== other; }) : [];
      state.personAsk = rest.length ? { id: id, others: rest } : null; render(); return;
    }
    var took = function (d, first) {                       // what the record now holds for this person, and what it joined
      var n = d.person, j = d.joined || [];
      if (n) { x.name = n.name; x.company = n.company; x.phones = n.phones; x.emails = n.emails; x.websites = n.websites; x.addresses = n.addresses; x.note = n.note; }
      if (j.length) p.people = p.people.filter(function (y) { return y === x || j.indexOf(y.name) < 0; });
      state.personAsk = (d.same || []).length ? { id: id, others: d.same } : null;
      state.personMsg = (first + (j.length ? ' Connected with ' + j.join(' and ') + ', already in your contacts. They are one contact now.' : '')).trim();
    };
    if (verb === 'join') {
      state.personMsg = 'Connecting…'; render();
      rpc('office_person', { p_token: token, p_proj: p.no, p_person: id, p_join: other }).then(function (d) {
        if (d && d.ok && d.saved) { took(d, ''); keepPerson(p, x, false, d.joined); render(); return; }
        state.personMsg = d && d.ok ? 'Not connected: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN.'; render();
      }).catch(function (e) { state.personMsg = 'Not connected (' + e.message + ').'; render(); });
      return;
    }
    var f = state.personForm || {}, name = (f.name || '').trim(), role = (f.role || '').trim(), gone = verb === 'remove';
    var list = function (k) { return (f[k] || []).map(function (v) { return String(v).trim(); }).filter(Boolean); };
    var contact = null;
    if (!gone) {
      if (!name) { state.personMsg = 'The name is empty.'; render(); return; }
      var phones = list('phones'), emails = list('emails').map(function (v) { return v.toLowerCase(); });
      var badP = phones.filter(function (v) { var d = v.replace(/[^0-9]/g, ''); return !(d.length === 10 || (d.length === 11 && d.charAt(0) === '1')); });
      var badE = emails.filter(function (v) { return !/^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(v); });
      if (badP.length) { state.personMsg = 'A phone number needs 10 digits: ' + badP.join(', ') + '.'; render(); return; }
      if (badE.length) { state.personMsg = 'That is not an email address: ' + badE.join(', ') + '.'; render(); return; }
      contact = { company: (f.company || '').trim(), phones: phones.map(ten), emails: emails, websites: list('websites'), addresses: list('addresses'), note: f.hasNote ? (f.note || '').trim() : '' };
    }
    var before = p.people.slice(), was = JSON.parse(JSON.stringify(x));
    var undo = function () { p.people = before; Object.keys(was).forEach(function (k) { x[k] = was[k]; }); if (!gone) state.editPerson = id; };   // his typing is still in the boxes
    if (gone) p.people = p.people.filter(function (y) { return y.id !== id; });
    else { x.name = name; x.role = role; x.company = contact.company; x.phones = contact.phones; x.emails = contact.emails; x.websites = contact.websites; x.addresses = contact.addresses; x.note = contact.note; }
    state.editPerson = null; state.personMsg = ''; state.personAsk = null; render();
    rpc('office_person', { p_token: token, p_proj: p.no, p_person: id, p_name: gone ? null : name, p_role: gone ? null : (role || null), p_remove: gone, p_contact: contact }).then(function (d) {
      if (d && d.ok && d.saved) { if (gone) state.personMsg = 'Taken off this job.'; else took(d, 'Saved.'); keepPerson(p, x, gone, d.joined); render(); return; }
      undo(); state.personMsg = d && d.ok ? 'Not saved: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN.'; render();
    }).catch(function (e) { undo(); state.personMsg = 'Not saved (' + e.message + ').'; render(); });
  }
  // His reply to something in Needs you goes to Jake on that project with the item named; the answer shows on the item
  function needTell(proj, key) {
    var text = (state.needText[key] || '').trim(), about = '';
    if (!text) return;
    if (key.indexOf('decision:') === 0) {
      var d = DEC.open.filter(function (x) { return 'decision:' + x.id === key; })[0];
      if (!d) return;
      about = 'About your question to me, decision ' + d.id + ' [need:' + key + ']: "' + d.what + '"' + (d.guess ? ' (your guess: ' + d.guess + ')' : '') + '.';
    } else if (key.indexOf('rule:') === 0) {
      var r = ASKS.rules.filter(function (x) { return 'rule:' + x.id === key; })[0];
      if (!r) return;
      about = 'About the rule waiting for my OK [need:' + key + '] (' + (r.retire_only ? 'you proposed retiring it' : 'you proposed it') + '): "' + r.rule + '".';
    } else {
      var n = BY[proj] ? openNeeds(BY[proj]).filter(function (x) { return x.key === key; })[0] : null;
      if (!n) return;
      about = 'About "' + (n.title || '') + '" in Needs you [need:' + key + ']' + (n.detail ? ' (' + n.detail + ')' : '') + '.';
    }
    rpc('office_tell', { p_token: token, p_proj: proj, p_text: about + '\n\nLance: ' + text }).then(function (d) {
      if (d && d.ok && d.saved) { SAID.unshift(d.instruction); delete state.needText[key]; state.needReply = null; watchReplies(); }
      else state.markMsg = d && d.ok ? 'Not sent: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN; your reply is still here.';
      render();
    }).catch(function (e) { state.markMsg = 'Not sent (' + e.message + '). Your reply is still here.'; render(); });
  }
  // A text not on a project: what he tells Jake about it goes to Jake with the text named, and the answer shows on it
  function looseTell(id) {
    var text = (state.loose[id] || '').trim();
    var t = (DATA.loose_texts || []).filter(function (x) { return String(x.id) === String(id); })[0];
    if (!text || !t) return;
    var body = 'About the ' + (t.channel === 'voicemail' ? 'voicemail' : 'text') + ' from ' + t.who + ' that is not on a project [text:' + t.id + ']' +
      (t.summary ? ' (' + t.summary + ')' : '') + '.\n\nLance: ' + text;
    rpc('office_tell', { p_token: token, p_proj: 'office', p_text: body }).then(function (d) {
      if (d && d.ok && d.saved) { SAID.unshift(d.instruction); delete state.loose[id]; watchReplies(); }
      render();
    }).catch(function () { render(); });
  }
  // While an instruction has no reply yet, ask for replies every 8 seconds (for at most 10 minutes).
  var watching = null, watchUntil = 0;
  function pending() { return SAID.some(function (s) { return !s.reply && (s.state === 'saved' || s.state === 'working'); }); }
  function watchReplies() {
    watchUntil = Date.now() + 10 * 60 * 1000;
    if (watching || !CFG) return;
    watching = setInterval(function () {
      if (!pending() || Date.now() > watchUntil || !token) { clearInterval(watching); watching = null; return; }
      rpc('office_replies', { p_token: token }).then(function (d) {
        if (!d || !d.ok) return;
        var before = JSON.stringify(SAID), typing = document.activeElement && document.activeElement.id === 'tell-text';
        SAID = d.instructions || SAID;
        if (JSON.stringify(SAID) !== before && !typing) render();
        if (JSON.stringify(SAID) !== before) { loadAsks(); setTimeout(refreshData, 12000); setTimeout(refreshData, 35000); }
      }).catch(function () {});
    }, 8000);
  }
  function start(data, readLine) {
    DATA = data; P = data.projects; BY = {};
    P.forEach(function (p) { BY[p.no] = p; });
    $('read').textContent = readLine;
    $('notice').hidden = !data.notice; $('notice').textContent = data.notice || '';
    $('foot').innerHTML = CFG ? 'Jake changes the schedule only when you tell him to. Nothing goes out until you tap Send. <button class="text" id="out" type="button">Sign out</button>'
                              : 'Read-only private preview. Tapping changes nothing.';
    var out = $('out');
    if (out) out.addEventListener('click', function () { var t = token; token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} rpc('office_logout', { p_token: t }).catch(function () {}); showLogin(''); });
    $('login').hidden = true; $('shell').hidden = false;
    $('ask').hidden = !CFG;
    route();
    if (pending()) watchReplies();
  }
  $('q').addEventListener('input', function (e) {
    state.q = e.target.value;
    if (state.q.trim() && state.no && window.matchMedia('(max-width: 959px)').matches) location.hash = '#' + state.view; else render();
  });
  $('ask').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = $('ask-text').value.trim(), b = $('ask-btn');
    if (!text || b.disabled) return;
    b.disabled = true;
    rpc('office_tell', { p_token: token, p_proj: 'office', p_text: text }).then(function (d) {
      b.disabled = false;
      if (d && d.ok && d.saved) { SAID.unshift(d.instruction); $('ask-text').value = ''; $('ask-note').textContent = 'Enter sends. Shift+Enter starts a new line.'; watchReplies(); render(); }
      else { $('ask-note').textContent = d && d.ok ? 'Not sent: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN.'; }
    }).catch(function () { b.disabled = false; $('ask-note').textContent = 'Could not reach the dashboard. Your words are still here.'; });
  });
  $('pend-btn').addEventListener('click', function () { state.chatPending = !state.chatPending; state.chatStick = true; render(); });
  $('ask-text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('ask').dispatchEvent(new Event('submit', { cancelable: true })); }
  });
  // Pull down at the top to refresh (Lance, 20 Nov 2026: "if I get to the top of the page and pull down it doesn't
  // refresh like a modern page would"). The home-screen app has no reload of its own, so the page does it.
  var pull = null, pullBar = document.createElement('div');
  pullBar.id = 'pullbar'; pullBar.textContent = 'Pull to refresh'; document.body.appendChild(pullBar);
  function scrollTopNow() { return Math.max(window.scrollY || 0, document.documentElement.scrollTop || 0); }
  document.addEventListener('touchstart', function (e) {
    pull = (e.touches.length === 1 && scrollTopNow() <= 0 && DATA && !$('shell').hidden) ? { x: e.touches[0].clientX, y: e.touches[0].clientY, far: 0 } : null;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!pull) return;
    var dy = e.touches[0].clientY - pull.y, dx = Math.abs(e.touches[0].clientX - pull.x);
    if (dy < 0 || dx > dy || scrollTopNow() > 0) { pull = null; pullBar.className = ''; return; }
    pull.far = dy;
    pullBar.className = dy > 30 ? 'show' : ''; pullBar.textContent = dy > 110 ? 'Release to refresh' : 'Pull to refresh';
  }, { passive: true });
  document.addEventListener('touchend', function () {
    if (!pull) return;
    var far = pull.far; pull = null;
    if (far <= 110) { pullBar.className = ''; return; }
    pullBar.textContent = 'Refreshing…'; pullBar.className = 'show';
    var done = function () { pullBar.className = ''; };
    Promise.resolve(CFG && token ? load() : null).then(done, done);
  }, { passive: true });
  // A swipe left or right, on a phone, goes between the chat and the list (Lance: "swiping left and right would be rad")
  var sw = null;
  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0], el = e.target;
    sw = (e.touches.length === 1 && !(el.closest && el.closest('textarea, input, .rtags'))) ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!sw || !DATA) return;
    var t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, quick = Date.now() - sw.at < 700;
    sw = null;
    if (!quick || Math.abs(dx) < 70 || Math.abs(dy) > 50 || window.innerWidth >= 960) return;
    if (document.body.getAttribute('data-show') !== 'list') {      // on a job: a swipe either way is "back to the list"
      if (state.no) location.hash = '#' + (state.lastList || 'queue');
      return;
    }
    // Chat | Queue | All projects, side by side as their tabs are. Finger to the right brings in the page on the left,
    // finger to the left the page on the right; at either end nothing happens. So the swipe back is the opposite one.
    var to = PAGES[PAGES.indexOf(state.view) + (dx > 0 ? -1 : 1)];
    if (!to) return;
    state.swipe = dx > 0 ? 'slide-r' : 'slide-l';
    location.hash = '#' + to;
  }, { passive: true });
  // On a PC the left side and the job on the right are two things: choosing Chat, Queue or All projects on the left
  // keeps the job open on the right (Lance, 22 Nov 2026: "on the desktop can this page show the general chat on the
  // left while on this screen"). On a phone there is one page at a time, so a tab is a page of its own, as before.
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('.nav a');
    if (!t || window.innerWidth < 960 || !state.no) return;
    var v = (t.getAttribute('href') || '').slice(1);
    if (PAGES.indexOf(v) < 0) return;
    e.preventDefault();
    if (state.view !== 'chat' && v !== state.view) keepPlace(state.view);
    var was = state.view;
    state.view = v;
    if (v === 'chat') state.chatStick = true; else state.lastList = v;
    render();
    if (v !== 'chat' && v !== was) backToPlace();
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-team]');
    if (a) { e.preventDefault(); location.replace(a.getAttribute('href')); }
  });
  var wasWide = window.innerWidth >= 1500;               // the layout changes at this width: draw again when the window crosses it
  window.addEventListener('resize', function () { var w = window.innerWidth >= 1500; if (w !== wasWide && DATA) { wasWide = w; state.chatStick = true; render(); } });
  window.addEventListener('hashchange', function () { if (DATA) route(); });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('pin').value.trim(); if (!pin) return;
    var b = $('pin-btn'); b.disabled = true; b.textContent = 'Checking…';
    rpc('office_login', { p_pin: pin }).then(function (d) {
      b.disabled = false; b.textContent = 'Open'; $('pin').value = '';
      if (d && d.ok) { token = d.token; try { localStorage.setItem(TOKEN_KEY, token); } catch (err) {} return load(); }
      $('login-err').textContent = d && d.hard ? 'Locked after too many wrong PINs. It stays locked until the PIN is set again from the AI PC.' : d && d.locked ? 'Too many wrong PINs. Try again in 15 minutes.' : d && d.no_pin ? 'No PIN has been set yet.' : 'That PIN is not recognized.';
    }).catch(function (err) { b.disabled = false; b.textContent = 'Open'; $('login-err').textContent = 'Could not reach the dashboard (' + err.message + ').'; });
  });

  var embedded = null;
  try { embedded = JSON.parse($('data').textContent); } catch (e) {}
  if (embedded && embedded.projects) { CFG = null; start(embedded, 'Sheets read ' + embedded.read_at); }
  else if (CFG) { try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {} if (token) load(); else showLogin(''); }
})();
</script>
