<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Plansman Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap">
<style>
/* Layout: one column on a phone (list, then a project page); two panes side by side on a wide screen.
   A project page leads with where it stands, what needs Lance and his line to the team; the reference
   material (money, permit, people, files, contract scope, history) sits below.
   Type is Lato, the face on the Plansman title block. State is said in words, not badges. */
:root {
  --bg: #f4f6f7; --surface: #ffffff; --ink: #1c2328; --muted: #5d6a73; --line: #dbe1e5;
  --accent: #14779f; --late: #b23d17; --soft: #e9eef1; --on-accent: #ffffff;
  --font: "Lato", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171a; --surface: #1a2125; --ink: #e7ecef; --muted: #96a3ac; --line: #2a343a;
    --accent: #58b6dc; --late: #f0906a; --soft: #222b30; --on-accent: #0c1114; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171a; --surface: #1a2125; --ink: #e7ecef; --muted: #96a3ac; --line: #2a343a;
  --accent: #58b6dc; --late: #f0906a; --soft: #222b30; --on-accent: #0c1114; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
.pane { min-width: 0; }
button.go { font: inherit; font-weight: 700; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 6px; padding: 11px 16px; cursor: pointer; }
button.go:disabled { opacity: .6; cursor: default; }
button.text { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--accent); cursor: pointer; }

/* sign in */
#login { max-width: 340px; margin: 18vh auto 0; display: grid; gap: 12px; }
#login b { font-weight: 900; letter-spacing: .14em; font-size: 13px; }
#login p { margin: 0; color: var(--muted); }
#login input { width: 100%; padding: 12px; font: inherit; font-size: 20px; letter-spacing: .2em; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
#login .err { color: var(--late); min-height: 1.4em; font-size: 14px; }

/* list pane */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand b { font-weight: 900; letter-spacing: .14em; font-size: 13px; }
.brand span { color: var(--muted); font-size: 12px; text-align: right; }
#q { width: 100%; margin-top: 10px; padding: 11px 12px; font: inherit; color: var(--ink); background: var(--surface);
     border: 1px solid var(--line); border-radius: 6px; }
#q::placeholder, textarea::placeholder { color: var(--muted); }
.nav { display: flex; gap: 22px; margin-top: 12px; border-bottom: 1px solid var(--line); }
.nav a { padding: 8px 0 9px; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
h2 { margin: 22px 0 2px; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12px; margin-left: 6px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row .addr { font-weight: 700; overflow-wrap: anywhere; }
.row .when { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 2px; }
.row .when.late { color: var(--late); font-weight: 700; }
.row .what { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row[aria-current="true"] .addr { color: var(--accent); }
.empty { color: var(--muted); padding: 12px 0; }
.foot { color: var(--muted); font-size: 12px; margin-top: 26px; }

/* project page */
.back { display: inline-block; color: var(--accent); font-weight: 700; padding: 4px 0 10px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 16px 8px; }
.sheet h1 { margin: 0; font-size: 23px; line-height: 1.2; font-weight: 900; text-wrap: balance; overflow-wrap: anywhere; }
.sheet .sub { color: var(--muted); margin-top: 4px; font-size: 14px; }
.stand { margin-top: 16px; padding: 12px 14px; background: var(--soft); border-radius: 6px; }
.stand .phase { font-size: 19px; font-weight: 900; }
.stand .due { color: var(--muted); font-size: 14px; }
.stand .due.late { color: var(--late); font-weight: 700; }
.stand p { margin: 8px 0 0; overflow-wrap: anywhere; }
.sec { padding: 14px 0; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sec.lead h3 { color: var(--ink); }
.sec p { margin: 0 0 6px; overflow-wrap: anywhere; }
.below { margin: 6px 0 0; padding-top: 14px; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 14px; font-variant-numeric: tabular-nums; }
.kv .k { color: var(--muted); }
.kv .v { text-align: right; overflow-wrap: anywhere; }
.kv .total { font-weight: 900; border-top: 1px solid var(--line); padding-top: 5px; }
.note { color: var(--muted); font-size: 14px; }
.late { color: var(--late); }
.item { padding: 7px 0; }
.item + .item { border-top: 1px dashed var(--line); }
.item .head { display: flex; justify-content: space-between; gap: 12px; }
.item .head b { font-weight: 700; }
.item .head span { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .body { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.need .item .body { color: var(--ink); font-size: 15px; }
.tell textarea { width: 100%; min-height: 84px; padding: 11px 12px; font: inherit; color: var(--ink); background: var(--bg);
                 border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
.tell .bar { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.tell .bar span { color: var(--muted); font-size: 13px; }
.said { margin-top: 10px; }
.tl { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 2px 10px; padding: 7px 0; }
.tl + .tl { border-top: 1px dashed var(--line); }
.tl .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tl .p { font-weight: 700; }
.tl .n { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.more { padding: 10px 0 4px; }
.blank { color: var(--muted); padding: 40px 0; text-align: center; }

@media (max-width: 959px) {
  body[data-show="detail"] #list { display: none; }
  body[data-show="list"] #detail { display: none; }
}
@media (min-width: 960px) {
  .shell { grid-template-columns: 400px minmax(0, 1fr); gap: 28px; align-items: start; }
  #list { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; padding-right: 8px; }
  .back { display: none; }
  .sheet { padding: 24px 26px 10px; }
}
</style>

<body>


<form id="login" hidden>
  <b>PLANSMAN</b>
  <p>The office. Enter your PIN.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" aria-label="PIN">
  <button class="go" id="pin-btn" type="submit">Open</button>
  <div class="err" id="login-err" role="alert"></div>
</form>

<div class="shell" id="shell" hidden>
  <div class="pane" id="list">
    <div class="brand"><b>PLANSMAN</b><span id="read"></span></div>
    <input id="q" type="search" placeholder="Find an address, number or name" autocomplete="off" aria-label="Find a project">
    <nav class="nav" aria-label="Views"><a href="#queue" id="nav-queue">Queue</a><a href="#projects" id="nav-projects">All projects</a></nav>
    <div id="listbody"></div>
    <p class="foot" id="foot"></p>
  </div>
  <div class="pane" id="detail"></div>
</div>

<script type="application/json" id="data">null</script>
<script>
(function () {
  var CFG = window.OFFICE || null;                 // set on the web build: { url, key }
  var TOKEN_KEY = 'plansman_office_token';
  var DATA = null, P = [], BY = {}, SAID = [], token = null;
  var state = { view: 'queue', no: null, q: '', allTimeline: false, draft: {}, sending: false, tellMsg: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var usd = function (n) { return n == null ? '' : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 }); };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function day(iso) { var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ''); return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + (m[1] === '2026' ? '' : ' ' + m[1].slice(2)) : (iso || ''); }
  function stamp(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function dueText(days) {
    if (days == null) return { t: '', late: false };
    if (days < 0) return { t: (-days) + (days === -1 ? ' day late' : ' days late'), late: true };
    if (days === 0) return { t: 'due today', late: true };
    return { t: 'due in ' + days + (days === 1 ? ' day' : ' days'), late: false };
  }
  var LANE = { Invoice: 'Invoice', Design: 'Design', Arch: 'Drafting', Engin: 'Engineering', T24: 'Title 24', Consult: 'Consult', Permit: 'Permit' };
  function isMine(t) { return t.who.toLowerCase() === 'lance'; }
  function who(p) { return p.company && p.contact ? p.company + ' (' + p.contact + ')' : (p.company || p.contact || ''); }
  function row(p, what, when, late) {
    return '<a class="row" href="#p-' + esc(p.no) + '"' + (state.no === p.no ? ' aria-current="true"' : '') + '><span class="addr">' + esc(p.address) +
      '</span><span class="when' + (late ? ' late' : '') + '">' + esc(when || '') + '</span><span class="what">' + esc(what || '') + '</span></a>';
  }
  function section(title, hint, rows) {
    return '<h2>' + esc(title) + ' <small>' + rows.length + (hint ? ' · ' + esc(hint) : '') + '</small></h2><div class="rows">' +
      (rows.length ? rows.join('') : '<div class="empty">Nothing here.</div>') + '</div>';
  }
  function byDays(a, b) { return (a.days == null ? 9999 : a.days) - (b.days == null ? 9999 : b.days); }

  function queue() {
    var live = P.filter(function (p) { return p.court !== 'done'; });
    var mine = [];
    live.forEach(function (p) { p.tasks.forEach(function (t) { if (isMine(t)) mine.push({ p: p, t: t, days: t.days }); }); });
    mine.sort(byDays);
    var mineRows = mine.map(function (x) {
      var d = dueText(x.t.days), label = LANE[x.t.lane] || x.t.lane;
      return row(x.p, label + (x.t.note ? ': ' + x.t.note : ' (' + x.p.phase + ')'), d.t || (x.t.date ? x.t.date.toLowerCase() : ''), d.late);
    });
    var hasMine = {}; mine.forEach(function (x) { hasMine[x.p.no] = 1; });
    function group(court, extra) {
      return live.filter(function (p) { return p.court === court && (!extra || extra(p)); }).sort(byDays).map(function (p) {
        var d = dueText(p.days);
        var others = p.tasks.filter(function (t) { return !isMine(t); }).map(function (t) { return t.who + ' has ' + (LANE[t.lane] || t.lane).toLowerCase(); });
        return row(p, p.phase + (others.length ? ' · ' + others.join(', ') : '') + (p.status ? ' · ' + p.status : ''), d.t, d.late);
      });
    }
    var unpaid = [];
    P.forEach(function (p) { ((p.money || {}).invoices || []).forEach(function (i) { if (i.sent && !i.paid) unpaid.push({ p: p, i: i }); }); });
    var unpaidRows = unpaid.map(function (x) {
      var bal = (x.p.money || {}).due;
      return row(x.p, 'Invoice ' + x.i.no + ' sent ' + x.i.sent + ', not marked paid' + (bal != null ? ' · balance due ' + usd(bal) : ''), '', false);
    });
    return section('Needs you', 'tasks under your name, most overdue first', mineRows) +
      section('In our court', 'no task under your name', group('ours', function (p) { return !hasMine[p.no]; })) +
      section('Unpaid invoices', '', unpaidRows) +
      section('Waiting on the client', '', group('client')) +
      section('At the city', '', group('city')) +
      section('Leads', 'not signed', group('lead')) +
      section('No phase set', '', group('unknown'));
  }
  function projects(list) {
    var years = {};
    list.forEach(function (p) { var y = '20' + p.no.slice(0, 2); (years[y] = years[y] || []).push(p); });
    return Object.keys(years).sort().reverse().map(function (y) {
      return section(y, '', years[y].map(function (p) { return row(p, p.no + ' · ' + (p.phase || 'no phase') + (who(p) ? ' · ' + who(p) : ''), '', false); }));
    }).join('') || '<div class="empty">No project matches.</div>';
  }
  function matches(p, q) {
    var hay = [p.no, p.address, p.contact, p.company, p.type, p.phase].concat(p.people.map(function (x) { return x.name + ' ' + x.company; })).join(' ').toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function kv(pairs) { return '<div class="kv">' + pairs.map(function (x) { return '<span class="k' + (x[2] || '') + '">' + esc(x[0]) + '</span><span class="v' + (x[2] || '') + '">' + esc(x[1]) + '</span>'; }).join('') + '</div>'; }
  function sec(title, html, cls) { return html ? '<div class="sec' + (cls ? ' ' + cls : '') + '"><h3>' + esc(title) + '</h3>' + html + '</div>' : ''; }
  function taskItem(t, showWho) {
    var td = dueText(t.days);
    return '<div class="item"><div class="head"><b>' + esc((LANE[t.lane] || t.lane) + (showWho ? ': ' + t.who : '')) + '</b><span' + (td.late ? ' class="late"' : '') + '>' +
      esc([t.date, td.t].filter(Boolean).join(' · ')) + '</span></div>' + (t.note ? '<div class="body">' + esc(t.note) + '</div>' : '') + '</div>';
  }
  function project(p) {
    var d = dueText(p.days), h = '';
    h += '<a class="back" href="#' + state.view + '">‹ Back</a><div class="sheet">';
    h += '<h1>' + esc(p.address) + '</h1><div class="sub">' + esc([p.no, p.type, who(p)].filter(Boolean).join(' · ')) + '</div>';
    h += '<div class="stand"><div class="phase">' + esc(p.phase || 'No phase set') + (p.signed ? '' : ' (not signed)') + '</div>' +
      (p.due || d.t ? '<div class="due' + (d.late ? ' late' : '') + '">' + esc([p.due ? 'Due ' + p.due : '', d.t].filter(Boolean).join(' · ')) + '</div>' : '') +
      (p.status ? '<p>' + esc(p.status) + '</p>' : '') + '</div>';

    // 1. what needs Lance
    var mine = p.tasks.filter(isMine), others = p.tasks.filter(function (t) { return !isMine(t); });
    var need = mine.map(function (t) { return taskItem(t, false); }).join('');
    if (p.latest) need += '<div class="item"><div class="head"><b>Latest from the front desk</b><span></span></div><div class="body">' + esc(p.latest) + '</div></div>';
    if (p.remarks) need += '<div class="item"><div class="head"><b>Your remarks</b><span></span></div><div class="body">' + esc(p.remarks) + '</div></div>';
    ((p.money || {}).invoices || []).forEach(function (i) {
      if (i.sent && !i.paid) need += '<div class="item"><div class="head"><b>Invoice ' + esc(i.no) + ' not marked paid</b><span>sent ' + esc(i.sent) + '</span></div></div>';
    });
    h += sec('Needs you', need || '<p class="note">Nothing is under your name on this project.</p>', 'lead need');

    // 2. his line to the team
    var said = SAID.filter(function (s) { return s.proj_no === p.no; });
    var tell = '';
    if (CFG) {
      tell += '<form id="tell"><textarea id="tell-text" placeholder="What should happen next on this job?" aria-label="Instruction to the team">' + esc(state.draft[p.no] || '') + '</textarea>' +
        '<div class="bar"><button class="go" id="tell-btn" type="submit"' + (state.sending ? ' disabled' : '') + '>' + (state.sending ? 'Saving…' : 'Tell the team') + '</button>' +
        '<span id="tell-msg">' + esc(state.tellMsg || 'Saved on this project. No desk acts on it yet.') + '</span></div></form>';
    } else {
      tell += '<p class="note">Your instruction box goes here on the plansman.ai version. This private preview cannot save anything.</p>';
    }
    if (said.length) tell += '<div class="said">' + said.map(function (s) {
      return '<div class="item"><div class="head"><b>You said</b><span>' + esc(stamp(s.created_at)) + ' · ' + esc(s.state) + '</span></div><div class="body">' + esc(s.body) + '</div></div>';
    }).join('') + '</div>';
    h += sec('Tell the team', tell, 'lead tell');

    // 3. what the team has
    h += sec('With the team', others.map(function (t) { return taskItem(t, true); }).join(''), 'lead');

    // reference, below
    h += '<div class="below">Reference</div>';
    var f = p.fees, m = p.money, money = '';
    if (m) {
      var tot = [];
      if (m.due != null) tot.push(['Balance due', usd(m.due), ' total']);
      if (m.value != null) tot.push(['Total value', usd(m.value)]);
      if (m.add_services) tot.push(['Added services so far', usd(m.add_services)]);
      money += kv(tot);
      money += m.invoices.map(function (i) {
        return '<div class="item"><div class="head"><b>Invoice ' + esc(i.no) + '</b><span' + (i.paid ? '' : ' class="late"') + '>' + esc(i.paid ? 'paid ' + i.paid : 'not marked paid') + '</span></div>' +
          '<div class="body">sent ' + esc(i.sent || '?') + (i.amount != null ? ' · ' + usd(i.amount) + ' received' : '') + '</div></div>';
      }).join('');
    }
    h += sec('Billing', money);
    if (p.permit) {
      var pm = p.permit;
      h += sec('Permit', kv([['City', pm.city], ['Record', pm.record || 'none yet'], ['Stage', [pm.stage, pm.round ? 'round ' + pm.round : ''].filter(Boolean).join(', ')],
        ['Submitted', day(pm.submitted)], ['City response expected', day(pm.expected)], ['Portal says', pm.portal_says], ['Last checked', day(pm.checked)]]
        .filter(function (x) { return x[1]; })) + '<p class="note" style="margin-top:8px">From Cora\'s permit ledger.</p>');
    } else if (p.permitting === 'not bought' && p.signed) {
      h += sec('Permit', '<p class="note">Permitting not bought: the builder or client submits. No permit record.</p>');
    }
    h += sec('People', p.people.map(function (x) {
      return '<div class="item"><div class="head"><b>' + esc(x.name) + '</b><span>' + esc(x.company) + '</span></div>' + (x.role ? '<div class="body">' + esc(x.role) + '</div>' : '') + '</div>';
    }).join(''));
    if (p.files) {
      var fl = p.files, rows = [['Folder', fl.folder]];
      if (fl.set) rows.push(['Live plan set', day(fl.set) + (fl.set_pages ? ', ' + fl.set_pages + ' pages' : '')]);
      if (fl.calcs) rows.push(['Calcs PDF', day(fl.calcs)]);
      if (fl.drawing) rows.push(['Drawing last saved', day(fl.drawing)]);
      if (fl.city_rounds.length || fl.city_loose) rows.push(['City comments', (fl.city_rounds.join(', ') || '') + (fl.city_loose ? (fl.city_rounds.length ? ' + ' : '') + fl.city_loose + ' loose PDFs' : '')]);
      h += sec('Files', kv(rows) + '<p class="note" style="margin-top:8px">Names and dates only, from the 18 Nov inventory. Files do not open from here yet.</p>');
    }
    var contract = '';
    if (p.scope) contract += '<p>' + esc(p.scope) + '</p>';
    if (p.sqft) contract += '<p class="note">' + esc(p.sqft) + ' sq ft</p>';
    if (f) {
      var lines = [['Site consult', f.consult], ['Design', f.design], ['Plans', f.plans], ['Permitting', f.permitting], ['Construction', f.construction]]
        .filter(function (x) { return x[1]; }).map(function (x) { return [x[0], usd(x[1])]; });
      if (f.total != null) lines.push(['Contract total', usd(f.total), ' total']);
      contract += kv(lines) + '<p class="note" style="margin-top:8px">Site consult: ' + esc(p.consult) + '. Permitting: ' + esc(p.permitting) + '.' + (f.hourly ? ' Added services at ' + usd(f.hourly) + ' an hour.' : '') + '</p>';
    }
    h += sec('Contract', contract);
    var tl = p.timeline, shown = state.allTimeline ? tl : tl.slice(0, 12);
    h += sec('History', shown.map(function (e) {
      return '<div class="tl"><span class="d">' + esc(day(e.when)) + '</span><span>' + (e.phase ? '<span class="p">' + esc(e.phase) + '</span>' : '') +
        (e.note ? '<div class="n">' + esc(e.note) + '</div>' : '') + '</span></div>';
    }).join('') + (tl.length > shown.length ? '<button class="text more" id="more" type="button">Show all ' + tl.length + ' entries</button>' : ''));
    return h + '</div>';
  }

  function render() {
    var q = state.q.trim().toLowerCase();
    $('listbody').innerHTML = q ? projects(P.filter(function (p) { return matches(p, q); })) : (state.view === 'projects' ? projects(P) : queue());
    ['queue', 'projects'].forEach(function (v) { if (state.view === v && !q) $('nav-' + v).setAttribute('aria-current', 'page'); else $('nav-' + v).removeAttribute('aria-current'); });
    var p = state.no && BY[state.no];
    $('detail').innerHTML = p ? project(p) : '<div class="blank">Pick a project on the left.</div>';
    document.body.setAttribute('data-show', p ? 'detail' : 'list');
    var more = $('more');
    if (more) more.addEventListener('click', function () { state.allTimeline = true; render(); });
    var form = $('tell');
    if (form && p) {
      $('tell-text').addEventListener('input', function (e) { state.draft[p.no] = e.target.value; });
      form.addEventListener('submit', function (e) { e.preventDefault(); tell(p.no); });
    }
  }
  function route() {
    var hsh = (location.hash || '#queue').slice(1), prev = state.no;
    if (hsh.indexOf('p-') === 0 && BY[hsh.slice(2)]) { state.no = hsh.slice(2); }
    else { state.no = null; state.view = hsh === 'projects' ? 'projects' : 'queue'; }
    if (state.no !== prev) { state.allTimeline = false; state.tellMsg = ''; }
    render();
    if (state.no && state.no !== prev) window.scrollTo(0, 0);
  }

  // ---- the web version: PIN, then read through the gated functions ----
  function rpc(name, body) {
    return fetch(CFG.url + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function showLogin(msg) {
    $('shell').hidden = true; $('login').hidden = false; $('login-err').textContent = msg || '';
    setTimeout(function () { $('pin').focus(); }, 50);
  }
  function load() {
    return rpc('office_read', { p_token: token }).then(function (d) {
      if (!d || !d.ok) { token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} showLogin('Signed out. Enter the PIN again.'); return; }
      if (!d.data) { showLogin('Nothing has been published to the app yet.'); return; }
      SAID = d.instructions || [];
      start(d.data, 'Sheets read ' + d.read_at);
    }).catch(function (e) { showLogin('Could not reach the office (' + e.message + ').'); });
  }
  function tell(no) {
    var text = (state.draft[no] || '').trim();
    if (!text || state.sending) return;
    state.sending = true; render();
    rpc('office_tell', { p_token: token, p_proj: no, p_text: text }).then(function (d) {
      state.sending = false;
      if (!d || !d.ok) { state.tellMsg = 'Signed out. Reload and enter the PIN; your text is still here.'; }
      else if (!d.saved) { state.tellMsg = 'Not saved: ' + (d.why || 'unknown reason') + '.'; }
      else { SAID.unshift(d.instruction); state.draft[no] = ''; state.tellMsg = 'Saved. No desk acts on it yet.'; }
      render();
    }).catch(function (e) { state.sending = false; state.tellMsg = 'Not saved (' + e.message + '). Your text is still here.'; render(); });
  }
  function start(data, readLine) {
    DATA = data; P = data.projects; BY = {};
    P.forEach(function (p) { BY[p.no] = p; });
    $('read').textContent = readLine;
    $('foot').innerHTML = CFG ? 'Nothing here changes the sheets or sends anything. <button class="text" id="out" type="button">Sign out</button>'
                              : 'Read-only private preview. Tapping changes nothing.';
    var out = $('out');
    if (out) out.addEventListener('click', function () { var t = token; token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} rpc('office_logout', { p_token: t }).catch(function () {}); showLogin(''); });
    $('login').hidden = true; $('shell').hidden = false;
    route();
  }
  $('q').addEventListener('input', function (e) {
    state.q = e.target.value;
    if (state.q.trim() && state.no && window.matchMedia('(max-width: 959px)').matches) location.hash = '#' + state.view; else render();
  });
  window.addEventListener('hashchange', function () { if (DATA) route(); });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('pin').value.trim(); if (!pin) return;
    var b = $('pin-btn'); b.disabled = true; b.textContent = 'Checking…';
    rpc('office_login', { p_pin: pin }).then(function (d) {
      b.disabled = false; b.textContent = 'Open'; $('pin').value = '';
      if (d && d.ok) { token = d.token; try { localStorage.setItem(TOKEN_KEY, token); } catch (err) {} return load(); }
      $('login-err').textContent = d && d.locked ? 'Too many wrong PINs. Try again in 15 minutes.' : d && d.no_pin ? 'No PIN has been set yet.' : 'That PIN is not recognized.';
    }).catch(function (err) { b.disabled = false; b.textContent = 'Open'; $('login-err').textContent = 'Could not reach the office (' + err.message + ').'; });
  });

  var embedded = null;
  try { embedded = JSON.parse($('data').textContent); } catch (e) {}
  if (embedded && embedded.projects) { CFG = null; start(embedded, 'Sheets read ' + embedded.read_at); }
  else if (CFG) { try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {} if (token) load(); else showLogin(''); }
})();
</script>

</body>
</html>
