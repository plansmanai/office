<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Plansman Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap">
<style>
/* Layout: one column on a phone (list, then a project page); two panes side by side on a wide screen.
   A project page leads with where it stands, what needs Lance and his line to the team; the reference
   material (money, permit, people, files, contract scope, history) sits below.
   Type is Lato, the face on the Plansman title block. State is said in words, not badges. */
:root {
  --bg: #f4f6f7; --surface: #ffffff; --ink: #1c2328; --muted: #5d6a73; --line: #dbe1e5;
  --accent: #14779f; --late: #b23d17; --soft: #e9eef1; --on-accent: #ffffff;
  --ok-bg: #dcefdf; --ok-ink: #1b5a2a; --warn-bg: #fbe8c2; --warn-ink: #6b4703; --bad-bg: #f9d9cd; --bad-ink: #8a2a0b; --phase: #0d6b5a;
  --font: "Lato", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171a; --surface: #1a2125; --ink: #e7ecef; --muted: #96a3ac; --line: #2a343a;
    --accent: #58b6dc; --late: #f0906a; --soft: #222b30; --on-accent: #0c1114; color-scheme: dark;
    --ok-bg: #1d3a26; --ok-ink: #a9dcb3; --warn-bg: #43350f; --warn-ink: #f1cf7a; --bad-bg: #4d2114; --bad-ink: #f6b39c; --phase: #5fcfae;
  }
}
:root[data-theme="dark"] {
  --bg: #12171a; --surface: #1a2125; --ink: #e7ecef; --muted: #96a3ac; --line: #2a343a;
  --accent: #58b6dc; --late: #f0906a; --soft: #222b30; --on-accent: #0c1114; color-scheme: dark;
    --ok-bg: #1d3a26; --ok-ink: #a9dcb3; --warn-bg: #43350f; --warn-ink: #f1cf7a; --bad-bg: #4d2114; --bad-ink: #f6b39c; --phase: #5fcfae;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
.pane { min-width: 0; }
button.go { font: inherit; font-weight: 700; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 6px; padding: 11px 16px; cursor: pointer; }
button.go:disabled { opacity: .6; cursor: default; }
button.text { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--accent); cursor: pointer; }

/* sign in */
#login { max-width: 340px; margin: 18vh auto 0; display: grid; gap: 12px; }
#login b { font-weight: 900; letter-spacing: .14em; font-size: 13px; }
#login p { margin: 0; color: var(--muted); }
#login input { width: 100%; padding: 12px; font: inherit; font-size: 20px; letter-spacing: .2em; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
#login .err { color: var(--late); min-height: 1.4em; font-size: 14px; }

/* list pane */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand b { font-weight: 900; letter-spacing: .14em; font-size: 13px; }
.brand span { color: var(--muted); font-size: 12px; text-align: right; }
#q { width: 100%; margin-top: 10px; padding: 11px 12px; font: inherit; color: var(--ink); background: var(--surface);
     border: 1px solid var(--line); border-radius: 6px; }
#q::placeholder, textarea::placeholder, #ask-text::placeholder { color: var(--muted); }
#ask { display: flex; gap: 8px; margin-top: 8px; }
#ask-text { flex: 1; min-width: 0; padding: 11px 12px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
#ask-said .item { padding: 10px 0 2px; }
#rules .item { padding: 10px 0 6px; }
#rules .rule { color: var(--ink); font-size: 15px; }
.answer textarea { width: 100%; min-height: 64px; margin-top: 6px; font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card, #fff); color: var(--ink); box-sizing: border-box; }
.answer .bar { margin-top: 6px; display: flex; gap: 14px; align-items: baseline; }
#ask-said .note { margin-top: 4px; }
.nav { display: flex; gap: 22px; margin-top: 12px; border-bottom: 1px solid var(--line); }
.nav a { padding: 8px 0 9px; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
h2 { margin: 22px 0 2px; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12px; margin-left: 6px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row .addr { font-weight: 700; overflow-wrap: anywhere; }
.no { color: var(--muted); font-weight: 400; margin-right: 7px; font-variant-numeric: tabular-nums; }
.ph { color: var(--phase); font-weight: 900; letter-spacing: .02em; margin-right: 8px; }
.bubs { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; padding-top: 1px; }
.bub { display: inline-block; font-size: 13px; font-weight: 700; line-height: 1.5; padding: 1px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bub.g { background: var(--ok-bg); color: var(--ok-ink); }
.bub.a { background: var(--warn-bg); color: var(--warn-ink); }
.bub.r { background: var(--bad-bg); color: var(--bad-ink); }
.stand .bubs { flex-direction: row; justify-content: flex-start; margin-top: 6px; }
.row .when { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 2px; }
.row .when.late { color: var(--late); font-weight: 700; }
.row .what { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row[aria-current="true"] .addr { color: var(--accent); }
.empty { color: var(--muted); padding: 12px 0; }
.foot { color: var(--muted); font-size: 12px; margin-top: 26px; }

/* project page */
.back { display: inline-block; color: var(--accent); font-weight: 700; padding: 4px 0 10px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 16px 8px; }
.sheet h1 { margin: 0; font-size: 23px; line-height: 1.2; font-weight: 900; text-wrap: balance; overflow-wrap: anywhere; }
.sheet .sub { color: var(--muted); margin-top: 4px; font-size: 14px; }
.stand { margin-top: 16px; padding: 12px 14px; background: var(--soft); border-radius: 6px; }
.stand .phase { font-size: 19px; font-weight: 900; color: var(--phase); letter-spacing: .02em; }
.stand .due { color: var(--muted); font-size: 14px; }
.stand .due.late { color: var(--late); font-weight: 700; }
.stand p { margin: 8px 0 0; overflow-wrap: anywhere; }
.sec { padding: 14px 0; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sec.lead h3 { color: var(--ink); }
.sec p { margin: 0 0 6px; overflow-wrap: anywhere; }
.below { margin: 6px 0 0; padding-top: 14px; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 14px; font-variant-numeric: tabular-nums; }
.kv .k { color: var(--muted); }
.kv .v { text-align: right; overflow-wrap: anywhere; }
.kv .total { font-weight: 900; border-top: 1px solid var(--line); padding-top: 5px; }
.note { color: var(--muted); font-size: 14px; }
.late { color: var(--late); }
.item { padding: 7px 0; }
.item + .item { border-top: 1px dashed var(--line); }
.item .head { display: flex; justify-content: space-between; gap: 12px; }
.item .head b { font-weight: 700; }
.item .head span { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .body { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.need .item .body { color: var(--ink); font-size: 15px; }
.item .body + .body { margin-top: 5px; }
.marks { margin-top: 6px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; font-size: 15px; }
.marks button.text { padding: 6px 0; }
button.text.quiet { color: var(--muted); font-weight: 400; }
.cleared { margin-top: 6px; }
.cleared .item .head span { white-space: normal; }
.draft { margin-top: 8px; padding: 10px 12px; background: var(--soft); border-radius: 6px; font-size: 15px; overflow-wrap: anywhere; }
.draft.real { background: none; border: 1px solid var(--line); }
.draft .lbl { font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.tell textarea { width: 100%; min-height: 84px; padding: 11px 12px; font: inherit; color: var(--ink); background: var(--bg);
                 border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
.tell .bar { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.tell .bar span { color: var(--muted); font-size: 13px; }
.said { margin-top: 10px; }
.tl { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 2px 10px; padding: 7px 0; }
.tl + .tl { border-top: 1px dashed var(--line); }
.tl .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tl .p { font-weight: 700; }
.tl .n { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.more { padding: 10px 0 4px; }
.blank { color: var(--muted); padding: 40px 0; text-align: center; }

@media (max-width: 959px) {
  body[data-show="detail"] #list { display: none; }
  body[data-show="list"] #detail { display: none; }
}
@media (min-width: 960px) {
  .shell { grid-template-columns: 400px minmax(0, 1fr); gap: 28px; align-items: start; }
  #list { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; padding-right: 8px; }
  .back { display: none; }
  .sheet { padding: 24px 26px 10px; }
}
</style>

<form id="login" hidden>

<script type="application/json" id="data">null</script>
<script>
(function () {
  var CFG = window.OFFICE || null;                 // set on the web build: { url, key }
  var TOKEN_KEY = 'plansman_office_token';
  var DATA = null, P = [], BY = {}, SAID = [], token = null;
  var state = { view: 'queue', no: null, q: '', allTimeline: false, draft: {}, sending: false, tellMsg: '', ans: {}, ruleMsg: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var usd = function (n) { return n == null ? '' : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 }); };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function day(iso) { var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ''); return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + (m[1] === '2026' ? '' : ' ' + m[1].slice(2)) : (iso || ''); }
  function stamp(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function dueText(days) {
    if (days == null) return { t: '', late: false };
    if (days < 0) return { t: (-days) + (days === -1 ? ' day late' : ' days late'), late: true };
    if (days === 0) return { t: 'due today', late: true };
    return { t: 'due in ' + days + (days === 1 ? ' day' : ' days'), late: false };
  }
  function ago(days) { return days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago'; }
  var LANE = { Invoice: 'Invoice', Design: 'Design', Arch: 'Drafting', Engin: 'Engineering', T24: 'Title 24', Consult: 'Consult', Permit: 'Permit' };
  function isMine(t) { return t.who.toLowerCase() === 'lance'; }
  function who(p) { return p.company && p.contact ? p.company + ' (' + p.contact + ')' : (p.company || p.contact || ''); }
  // One clock everywhere: days WAITING. Lance, 19 Nov 2026: "i've never separated days waiting against due
  // date... everything should just be based on how long its been sitting". Colors by how long, in one place:
  // [amber from, red from], in days. A person waiting on a reply turns sooner than work does.
  var SEV = { reply: [2, 4], other: [7, 14] };
  function isReply(n) { return n.kind === 'email' || n.kind === 'question'; }
  function sev(n) { var t = SEV[isReply(n) ? 'reply' : 'other']; return n.days >= t[1] ? 'r' : n.days >= t[0] ? 'a' : 'g'; }
  function dtext(d) { return d === 0 ? 'today' : d + (d === 1 ? ' day' : ' days'); }
  function bub(n, label) { return '<span class="bub ' + sev(n) + '">' + esc(label) + '</span>'; }
  // The bubbles for a project: the worst wait governs (and sets the order of the list); when a person is
  // waiting on a reply, their wait gets its own bubble, since it is a different clock from the work.
  function bubsFor(ns) {
    var timed = ns.filter(function (n) { return n.days != null; }), worst = null, person = null;
    timed.forEach(function (n) {
      if (!worst || n.days > worst.days) worst = n;
      if (isReply(n) && (!person || n.days > person.days)) person = n;
    });
    if (!worst) return '';
    var h = isReply(worst) ? '' : bub(worst, 'Waiting ' + dtext(worst.days));
    if (person) h += bub(person, 'Reply ' + dtext(person.days));
    return h;
  }
  function row(p, what, when, late, phase, bubs) {
    return '<a class="row" href="#p-' + esc(p.no) + '"' + (state.no === p.no ? ' aria-current="true"' : '') + '><span class="addr"><span class="no">' + esc(p.no) + '</span>' + esc(p.address) + '</span>' +
      (bubs ? '<span class="bubs">' + bubs + '</span>' : '<span class="when' + (late ? ' late' : '') + '">' + esc(when || '') + '</span>') +
      '<span class="what">' + (phase ? '<b class="ph">' + esc(phase) + '</b>' : '') + esc(what || '') + '</span></a>';
  }
  function section(title, hint, rows) {
    return '<h2>' + esc(title) + ' <small>' + rows.length + (hint ? ' · ' + esc(hint) : '') + '</small></h2><div class="rows">' +
      (rows.length ? rows.join('') : '<div class="empty">Nothing here.</div>') + '</div>';
  }
  function byDays(a, b) { return (a.days == null ? 9999 : a.days) - (b.days == null ? 9999 : b.days); }

  // The queue, by project (Lance, 19 Nov 2026: "i like it being structured by project and then it opens up").
  // "Needs you" is every project with something waiting on him to move it forward, longest wait first:
  // "when i say age i mean wait time for advancement". The things themselves (p.needs, built in app/export.py)
  // are listed when the project opens. Handled / Not my move take one off (MARKS, table office_item_marks).
  var MARKS = {};
  // ASKS: what the team has put to Lance. questions = something only he can answer (it sits on the project as
  // a thing waiting on him until he answers); rules = standing rules proposed by the team, which count only
  // after his tap (db/010).
  var ASKS = { questions: [], rules: [] };
  function daysSince(iso) { var t = new Date(iso).getTime(); return isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 86400000)); }
  function cap(w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : ''; }
  function questionNeeds(p) {
    return ASKS.questions.filter(function (q) { return q.proj_no === p.no && q.state === 'open'; }).map(function (q) {
      return { key: 'question:' + q.id, kind: 'question', qid: q.id, title: cap(q.agent) + ' asks', detail: q.body, why: q.why, days: daysSince(q.asked_at) };
    });
  }
  function openNeeds(p) { return questionNeeds(p).concat((p.needs || []).filter(function (n) { return !MARKS[n.key]; })); }
  function wait(n) { return n.days == null ? '' : n.days === 0 ? 'since today' : n.days + (n.days === 1 ? ' day' : ' days'); }
  function longest(ns) { var m = -1; ns.forEach(function (n) { if (n.days != null && n.days > m) m = n.days; }); return m; }
  function whoHasWhat(p) {
    var by = {}, order = [];
    p.tasks.forEach(function (t) {
      if (t.lane === 'Invoice') return;
      var w = isMine(t) ? 'you' : t.who;
      if (!by[w]) { by[w] = []; order.push(w); }
      by[w].push((LANE[t.lane] || t.lane).toLowerCase());
    });
    return order.map(function (w) { return w + ': ' + by[w].join(', '); }).join('; ');
  }
  function queue() {
    var need = [], inNeed = {};
    P.forEach(function (p) { var ns = openNeeds(p); if (ns.length) { need.push({ p: p, ns: ns, w: longest(ns) }); inNeed[p.no] = 1; } });
    need.sort(function (x, y) { return y.w - x.w; });
    var needRows = need.map(function (x) {
      var p = x.p;
      return row(p, x.ns.map(function (n) { return n.title; }).join(' · '), '', false, p.phase || 'No phase', bubsFor(x.ns) || ' ');
    });
    var live = P.filter(function (p) { return p.court !== 'done' && !inNeed[p.no]; });
    // with the client, at the city, leads: the date is when an answer was expected, so it is never "late" in red
    function group(court) {
      return live.filter(function (p) { return p.court === court; }).sort(byDays).map(function (p) {
        var t = p.days == null ? '' : p.days < 0 ? 'expected ' + ago(-p.days) : p.days === 0 ? 'expected today' : 'expected in ' + p.days + (p.days === 1 ? ' day' : ' days');
        var l = whoHasWhat(p);
        return row(p, [l, p.status].filter(Boolean).join(' · '), court === 'ours' ? '' : t, false, p.phase || 'No phase');
      });
    }
    var cleared = group('ours');
    return section('Needs you', 'projects with something waiting on you, longest wait first', needRows) +
      (cleared.length ? section('Nothing open for you', 'in our court; you marked everything handled or not your move', cleared) : '') +
      section('Waiting on the client', '', group('client')) +
      section('At the city', '', group('city')) +
      section('Leads', 'not signed', group('lead')) +
      section('No phase set', '', group('unknown'));
  }
  function projects(list) {
    var years = {};
    list.forEach(function (p) { var y = '20' + p.no.slice(0, 2); (years[y] = years[y] || []).push(p); });
    return Object.keys(years).sort().reverse().map(function (y) {
      return section(y, '', years[y].map(function (p) { return row(p, who(p), '', false, p.phase || 'No phase', bubsFor(openNeeds(p))); }));
    }).join('') || '<div class="empty">No project matches.</div>';
  }
  function matches(p, q) {
    var hay = [p.no, p.address, p.contact, p.company, p.type, p.phase].concat(p.people.map(function (x) { return x.name + ' ' + x.company; })).join(' ').toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function kv(pairs) { return '<div class="kv">' + pairs.map(function (x) { return '<span class="k' + (x[2] || '') + '">' + esc(x[0]) + '</span><span class="v' + (x[2] || '') + '">' + esc(x[1]) + '</span>'; }).join('') + '</div>'; }
  function sec(title, html, cls) { return html ? '<div class="sec' + (cls ? ' ' + cls : '') + '"><h3>' + esc(title) + '</h3>' + html + '</div>' : ''; }
  function taskItem(t, showWho) {
    var td = dueText(t.days);
    return '<div class="item"><div class="head"><b>' + esc((LANE[t.lane] || t.lane) + (showWho ? ': ' + t.who : '')) + '</b><span' + (td.late ? ' class="late"' : '') + '>' +
      esc([t.date, td.t].filter(Boolean).join(' · ')) + '</span></div>' + (t.note ? '<div class="body">' + esc(t.note) + '</div>' : '') + '</div>';

  // ---- the web version: PIN, then read through the gated functions ----
  function rpc(name, body) {
    return fetch(CFG.url + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function showLogin(msg) {

    setTimeout(function () { $('pin').focus(); }, 50);
  }
  function load() {
    return rpc('office_read', { p_token: token }).then(function (d) {
      if (!d || !d.ok) { token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} showLogin('Signed out. Enter the PIN again.'); return; }
      if (!d.data) { showLogin('Nothing has been published to the app yet.'); return; }
      SAID = d.instructions || [];
      start(d.data, 'Sheets read ' + d.read_at);
      rpc('office_marks', { p_token: token }).then(function (m) {
        if (!m || !m.ok) return;
        MARKS = {}; (m.marks || []).forEach(function (x) { MARKS[x.item_key] = x; }); render();
      }).catch(function () {});
      loadAsks();
    }).catch(function (e) { showLogin('Could not reach the dashboard (' + e.message + ').'); });
  }
  // What the team has put to him: read on load and again while a reply is being waited for
  function loadAsks() {
    if (!CFG || !token) return;
    rpc('office_asks', { p_token: token }).then(function (d) {
      if (!d || !d.ok) return;
      var before = JSON.stringify(ASKS), typing = document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
      ASKS = { questions: d.questions || [], rules: d.rules || [] };
      if (JSON.stringify(ASKS) !== before && !typing) render();
    }).catch(function () {});
  }
  // Approve or refuse a proposed rule: shown at once, put back if the save fails
  function decideRule(id, decision) {
    var before = ASKS.rules.slice();
    ASKS.rules = ASKS.rules.filter(function (r) { return r.id !== id; });
    state.ruleMsg = ''; render();
    rpc('office_rule', { p_token: token, p_id: id, p_decision: decision }).then(function (d) {
      if (d && d.ok && d.saved) { state.ruleMsg = decision === 'approve' ? 'Approved. The team follows it from the next job.' : 'Refused. It will not be used.'; render(); return; }
      ASKS.rules = before; state.ruleMsg = d && d.ok ? 'Not saved: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN.'; render();
    }).catch(function (e) { ASKS.rules = before; state.ruleMsg = 'Not saved (' + e.message + ').'; render(); });
  }
  function answerQuestion(qid) {
    var text = (state.ans[qid] || '').trim();

      if (d && d.ok && d.saved) {
        ASKS.questions.forEach(function (q) { if (q.id === qid) { q.state = 'answered'; q.answer = text; q.answered_at = new Date().toISOString(); } });
        delete state.ans[qid]; state.ansMsg = ''; setTimeout(loadAsks, 45000);
      } else { state.ansMsg = d && d.ok ? 'Not saved: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN; your answer is still here.'; }
      render();
    }).catch(function (e) { state.ansMsg = 'Not saved (' + e.message + '). Your answer is still here.'; render(); });
  }
  // Handled / Not my move / Put back: shown at once, saved to the record; put right again if the save fails
  function mark(no, key, what, who) {
    var before = MARKS[key];
    if (what === 'open') delete MARKS[key]; else MARKS[key] = { mark: what, waiting_on: who || null, marked_at: new Date().toISOString() };
    state.pick = null; state.markMsg = ''; render();
    rpc('office_mark', { p_token: token, p_proj: no, p_key: key, p_mark: what, p_who: who || null }).then(function (d) {
      if (d && d.ok && d.saved) return;
      if (before) MARKS[key] = before; else delete MARKS[key];
      state.markMsg = d && d.ok ? 'Not saved: ' + (d.why || 'try again') + '.' : 'Signed out. Reload and enter the PIN.'; render();
    }).catch(function (e) {
      if (before) MARKS[key] = before; else delete MARKS[key];
      state.markMsg = 'Not saved (' + e.message + ').'; render();
    });
  }
  function tell(no) {

      state.sending = false;

      else if (!d.saved) { state.tellMsg = 'Not saved: ' + (d.why || 'unknown reason') + '.'; }

  // While an instruction has no reply yet, ask for replies every 8 seconds (for at most 10 minutes).
  var watching = null, watchUntil = 0;

  function watchReplies() {
    watchUntil = Date.now() + 10 * 60 * 1000;
    if (watching || !CFG) return;
    watching = setInterval(function () {
      if (!pending() || Date.now() > watchUntil || !token) { clearInterval(watching); watching = null; return; }
      rpc('office_replies', { p_token: token }).then(function (d) {
        if (!d || !d.ok) return;
        var before = JSON.stringify(SAID), typing = document.activeElement && document.activeElement.id === 'tell-text';
        SAID = d.instructions || SAID;
        if (JSON.stringify(SAID) !== before && !typing) render();

    P.forEach(function (p) { BY[p.no] = p; });
    $('read').textContent = readLine;
    $('foot').innerHTML = CFG ? 'Nothing here changes the sheets or sends anything. <button class="text" id="out" type="button">Sign out</button>'
                              : 'Read-only private preview. Tapping changes nothing.';
    var out = $('out');
    if (out) out.addEventListener('click', function () { var t = token; token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} rpc('office_logout', { p_token: t }).catch(function () {}); showLogin(''); });
    $('login').hidden = true; $('shell').hidden = false;
    $('ask').hidden = !CFG;
    route();
    if (pending()) watchReplies();
  }
  $('q').addEventListener('input', function (e) {
    state.q = e.target.value;
    if (state.q.trim() && state.no && window.matchMedia('(max-width: 959px)').matches) location.hash = '#' + state.view; else render();
  });
  $('ask').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = $('ask-text').value.trim(), b = $('ask-btn');
    if (!text || b.disabled) return;
    b.disabled = true;
    rpc('office_tell', { p_token: token, p_proj: 'office', p_text: text }).then(function (d) {
      b.disabled = false;
      if (d && d.ok && d.saved) { SAID.unshift(d.instruction); $('ask-text').value = ''; watchReplies(); render(); }
      else { $('ask-text').placeholder = d && d.ok ? 'Not saved: ' + (d.why || 'try again') : 'Signed out. Reload and enter the PIN.'; }
    }).catch(function () { b.disabled = false; $('ask-text').placeholder = 'Could not reach the dashboard. Try again.'; });
  });
  window.addEventListener('hashchange', function () { if (DATA) route(); });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('pin').value.trim(); if (!pin) return;
    var b = $('pin-btn'); b.disabled = true; b.textContent = 'Checking…';
    rpc('office_login', { p_pin: pin }).then(function (d) {
      b.disabled = false; b.textContent = 'Open'; $('pin').value = '';
      if (d && d.ok) { token = d.token; try { localStorage.setItem(TOKEN_KEY, token); } catch (err) {} return load(); }
      $('login-err').textContent = d && d.hard ? 'Locked after too many wrong PINs. It stays locked until the PIN is set again from the AI PC.' : d && d.locked ? 'Too many wrong PINs. Try again in 15 minutes.' : d && d.no_pin ? 'No PIN has been set yet.' : 'That PIN is not recognized.';
    }).catch(function (err) { b.disabled = false; b.textContent = 'Open'; $('login-err').textContent = 'Could not reach the dashboard (' + err.message + ').'; });
  });

  var embedded = null;
  try { embedded = JSON.parse($('data').textContent); } catch (e) {}
  if (embedded && embedded.projects) { CFG = null; start(embedded, 'Sheets read ' + embedded.read_at); }
  else if (CFG) { try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {} if (token) load(); else showLogin(''); }
})();
</script>

</body>
</html>
