<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>Plansman Drew</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
/* The Drafting window (docs/DREW-ON-P4.md): one project, Drew live. Same look as the dashboard (Lance's brief):
   Volcanic Black on a near-white backdrop, Jost only, one hairline, square corners, flat, light only.
   A computer: the large sheet area on the left (Live view / Sheets), Drew's conversation on the right.
   A phone: one of the three at a time, switched at the top. */
:root {
  color-scheme: light only;
  --bg: #FCFBF9; --soft: #F4F2ED; --ink: #1B1B19; --muted: #6E695F; --rule: rgba(27, 27, 25, .2);
  --oak: #B2906B; --sage: #4F6B66; --long: #9A3B2E; --on-ink: #FCFBF9;
  --jake: #0873A4; --drew: #007B71; --cora: #CB2F68;      /* each one's own color, as on the dashboard (Lance, 23 Nov 2026) */
  --sans: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; border-radius: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
a { color: inherit; text-decoration: none; }
.lbl, .tabs button, button.go, .back { font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-weight: 400; font-size: .66rem; }
header { padding: 16px 18px 12px; border-bottom: 1px solid var(--ink); }
header .hin, header .jobrow { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
header .jobrow { flex: 1 1 100%; }
header .brand { display: none; }
/* On a PC the header is the dashboard's own: Plansman at the top left, the Jake / Drew / Cora bar exactly where it sits
   above a job there (the same column widths), and the job's number, address and phase under the logo (Lance, 22 Nov
   2026: "keep the header consistent on all pages with plansman at top left"). */
@media (min-width: 861px) {
  header { padding: 22px 18px 12px; }
  header .hin { display: grid; grid-template-columns: 440px minmax(0, 1fr); column-gap: 40px; row-gap: 12px; align-items: end; max-width: 1360px; margin: 0 auto; }
  header .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--ink); grid-column: 1; grid-row: 1; }
  header .brand b { font-weight: 300; letter-spacing: .5em; font-size: 15px; text-transform: uppercase; }
  header .brand span { color: var(--muted); font-size: 12px; text-align: right; }
  header .teambar { grid-column: 2; grid-row: 1; margin: 0; align-self: start; }
  header .jobrow { grid-column: 1 / -1; grid-row: 2; }
}
.teambar span, .teambar a { height: 42px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: center; }
header .brand a { display: inline-flex; align-items: baseline; }
/* The line under the job says something only when there is something to say: he is working (and on what), or he is
   not running. "Drew is here" said nothing and took a line of the phone (Lance, 23 Nov 2026: "remove the Drew is
   here"), so while he is simply there the line is gone. On a PC it sits on the live picture, only while he is not there. */
body.here header .status { display: none; }
.view.live { position: relative; }
.view.live > .status { display: none; position: absolute; top: 12px; left: 14px; z-index: 6; margin: 0; padding: 7px 11px; background: var(--bg); border: 1px solid var(--rule);
  font-size: 13px; color: var(--muted); align-items: center; gap: 8px; }
body.off .view.live > .status { display: flex; }
.view.live > .status .dot { width: 8px; height: 8px; background: var(--rule); display: inline-block; }
@media (min-width: 1500px) {
  /* THE TOP ROW, identical in dashboard.html and drafting.html: 22px from the top, 18px from the left, 42px high;
     columns 400px | 440px | the rest, 40px apart. Change a number here and change it in the other file. */
  header { padding: 22px 18px 0; border-bottom: 0; }
  header .hin { max-width: none; margin: 0; grid-template-columns: 400px 440px minmax(0, 1fr); column-gap: 40px; row-gap: 0; align-items: stretch; height: 42px; }
  header .brand { width: auto; grid-column: 1; grid-row: 1; height: 42px; box-sizing: border-box; padding: 0; align-items: center; }
  header .jobrow { grid-column: 2; grid-row: 1; height: 42px; box-sizing: border-box; flex: none; flex-wrap: nowrap; align-items: center; gap: 12px; min-width: 0;
                   border-bottom: 1px solid var(--rule); }
  header .jobrow h1 { font-size: 13px; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .jobrow .phase { white-space: nowrap; }
  header .teambar { grid-column: 3; grid-row: 1; margin: 0; }
  nav.tabs { display: none; }
  main { margin-top: 14px; border-top: 1px solid var(--rule); }
}
/* Jake / Drew / Cora along the top, the same bar as on the job's page; this window's own name is the grey one */
.teambar { flex: 0 0 100%; display: flex; gap: 8px; margin: 0 0 6px; font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; }
.teambar a { flex: 1; text-align: center; padding: 12px 8px 11px; border: 1px solid var(--ink); color: var(--ink); font-size: .7rem; text-decoration: none; }
.teambar a.on { background: var(--rule); border-color: var(--rule); pointer-events: none; }
.teambar .badge { display: inline-block; min-width: 18px; margin-left: 8px; padding: 2px 5px 1px; background: var(--long, #9b3a32); color: #fff; font-style: normal; font-size: .62rem; letter-spacing: .04em; line-height: 1.3; text-align: center; }
.teambar .badge.jake { background: var(--jake); } .teambar .badge.drew { background: var(--drew); } .teambar .badge.cora { background: var(--cora); }
header h1 { margin: 0; font-weight: 300; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; }
header h1 .no { margin-right: 12px; }
header .phase { font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; border: 1px solid var(--rule); padding: 2px 7px 1px; color: var(--muted); }
/* the same colors as the dashboard's phase bubble: red in our court, green out of it, yellow a lead (Lance, 24 Nov 2026) */
header .phase.c-ours { background: rgba(154, 59, 46, .1); border-color: #9A3B2E; color: #9A3B2E; }
header .phase.c-out { background: rgba(79, 107, 102, .11); border-color: #4F6B66; color: #4F6B66; }
header .phase.c-lead { background: rgba(226, 180, 60, .2); border-color: #C9A43A; color: #8A6712; }
header .status { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
header .dot { width: 8px; height: 8px; background: var(--rule); display: inline-block; }
header .dot.on { background: var(--sage); } header .dot.busy { background: var(--oak); }
.tabs { display: none; border-bottom: 1px solid var(--rule); }
.tabs button { flex: 1; background: none; border: 0; padding: 12px 0 11px; color: var(--muted); border-bottom: 1px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs button[aria-current] { color: var(--ink); border-bottom-color: var(--ink); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
.stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--rule); }
.stage .switch { display: flex; gap: 22px; padding: 10px 18px 0; border-bottom: 1px solid var(--rule); }
.stage .switch button { background: none; border: 0; padding: 6px 0 9px; color: var(--muted); border-bottom: 1px solid transparent; margin-bottom: -1px; cursor: pointer;
  font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-size: .66rem; }
.stage .switch button[aria-current] { color: var(--ink); border-bottom-color: var(--ink); }
.view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--muted); padding: 24px; text-align: center; }
.view p { max-width: 420px; margin: 0; }
.view.live { padding: 0; flex-direction: column; align-items: stretch; justify-content: flex-start; background: #1d2127; overflow: auto; }
.view.live img { width: 100%; height: auto; display: block; }
.view.live p { margin: auto; color: #b9bdc4; padding: 24px; }
#live-cap { padding: 8px 14px; font-size: 12.5px; color: #b9bdc4; display: flex; justify-content: space-between; gap: 12px; }
.talk { min-height: 0; display: flex; flex-direction: column; }
#said { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 8px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; }
/* a draft of this one's own, waiting for his Send (Lance, 22 Nov 2026) */
.dr { border: 1px solid var(--ink); padding: 12px 14px; max-width: 100%; }
.dr .lbl { color: var(--muted); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.dr .subj { font-weight: 500; margin-bottom: 6px; }
.dr .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.dr textarea { width: 100%; min-height: 160px; padding: 10px 12px; font: inherit; border: 1px solid var(--ink); background: transparent; resize: vertical; }
.dr .note { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
.dr .note.bad { color: var(--long, #8a3b34); }
.dr textarea.rp { min-height: 64px; }
.dr.gone { border-color: var(--rule); padding: 8px 12px; color: var(--muted); font-size: 13.5px; }
.msg .lbl { color: var(--muted); font-size: .6rem; margin-bottom: 3px; }
.msg .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.ls { display: block; white-space: normal; }
.ls.a { margin-top: 7px; }
.ls.b { margin-bottom: 7px; }
.li { display: flex; gap: .45em; margin: 0 0 5px; }
.li:last-child { margin-bottom: 0; }
.li > .lin { flex: none; min-width: 1.2em; font-variant-numeric: tabular-nums; }
.li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; text-align: left; }
.msg.me .txt { background: var(--ink); color: var(--on-ink); padding: 9px 12px; }
.msg.drew .txt { border-left: 1px solid var(--ink); padding: 2px 0 2px 12px; }
.msg.work { color: var(--muted); font-size: 14px; }
.msg.work .txt { border-left: 1px solid var(--rule); padding-left: 12px; }
.msg.failed .txt { color: var(--long); }
.empty { color: var(--muted); margin: auto 0; text-align: center; }
form { border-top: 1px solid var(--rule); padding: 12px 18px max(14px, env(safe-area-inset-bottom, 0px)); }
textarea { width: 100%; min-height: 64px; max-height: 40vh; resize: none; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--rule); padding: 10px 11px; }
textarea:focus { border-color: var(--ink); outline: none; }
.bar { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.bar span { color: var(--muted); font-size: 13px; }
button.go { color: var(--on-ink); background: var(--ink); border: 1px solid var(--ink); padding: 11px 20px; cursor: pointer; }
button.go:disabled { opacity: .45; cursor: default; }
/* The box standard (scratch/BOX_SPEC.md; Lance, 23 Nov 2026: "I'd like there to be consistency with these boxed formal
   questions and my buttons to work through them"). Every box that waits on him ends in ONE row, always in this order:
   the black button takes it (button.go), Reply (button.sec, outlined) opens a text box inside the box, the grey one
   (button.dim) turns it down, and Edit, on a draft, is grey and last. The row wraps on a phone; a button there is at
   least 40px tall, and a little narrower at the sides than the Send under the page so that four fit across a phone. */
button.sec, button.dim { font-family: var(--sans); text-transform: uppercase; letter-spacing: .18em; font-weight: 400; font-size: .66rem; padding: 11px 20px; background: transparent; cursor: pointer; }
button.sec { color: var(--ink); border: 1px solid var(--ink); }
button.dim { color: var(--muted); border: 1px solid var(--rule); }
button.sec:disabled, button.dim:disabled { opacity: .45; cursor: default; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.acts button { min-height: 40px; padding-left: 16px; padding-right: 16px; }
.acts .was { color: var(--muted); font-size: 13px; }
textarea.rp { display: block; margin-top: 12px; font-size: 16px; border-color: var(--ink); }
.gate { margin: 18vh auto 0; max-width: 360px; text-align: center; color: var(--muted); }
.gate a { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
@media (max-width: 860px) {
  .tabs { display: flex; }
  main { display: block; position: relative; }
  .stage, .talk { position: absolute; inset: 0; border-right: 0; }
  .stage .switch { display: none; }
  main[data-show="drew"] .stage, main[data-show="live"] .talk, main[data-show="sheets"] .talk, main[data-show="engr"] .talk { display: none; }
  header .status { margin-left: 0; width: 100%; }
}
/* the conversation, the way Jake's chat looks: he is on the right on grey, Drew on the left in a thin frame */
.msg { max-width: 90%; padding: 10px 14px 12px; overflow-wrap: anywhere; }
.msg .lbl { font-size: .56rem; margin-bottom: 6px; }
.msg.me { align-self: flex-end; background: #E7E5E0; }
.msg.me .lbl { text-align: right; }
.msg.me .txt { background: none; color: var(--ink); padding: 0; }
.msg.drew { align-self: flex-start; border: 1px solid var(--rule); }
.msg.drew .txt { border-left: 0; padding: 0; }
.msg.drew.work { border: 0; border-left: 1px solid var(--rule); padding: 2px 0 2px 12px; }
/* the bar between the view and the chat: drag it left or right; double-click to give the view the whole width */
#split { display: none; }
@media (min-width: 861px) {
  main { grid-template-columns: minmax(0, 1fr) 9px var(--talk, 440px); }
  .stage { border-right: 0; }
  #split { display: block; cursor: col-resize; background: var(--soft); border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); position: relative; touch-action: none; }
  #split::after { content: ''; position: absolute; top: 50%; left: 3px; width: 1px; height: 34px; margin-top: -17px; background: var(--ink); opacity: .45; }
  .talk { overflow: hidden; min-width: 0; }
}
/* Sheets: check-ins at full size, drawn on with a finger, a mouse or a pencil */
.view.sheets { display: block; padding: 0; text-align: left; background: var(--bg); color: var(--ink); overflow: auto; }
.view.sheets[hidden] { display: none; }
#sheet-list .none, #engr-list .none { color: var(--muted); padding: 28px 18px; margin: 0; max-width: none; }
/* ENGR: the calcs by section, the package, the Title 24 */
.ehead { margin: 0; padding: 24px 18px 10px; font-family: var(--sans); font-weight: 500; letter-spacing: .22em; text-transform: uppercase; font-size: .68rem; color: var(--muted); border-bottom: 1px solid var(--ink); }
.esteps { padding: 12px 18px; border-bottom: 1px solid var(--ink); }
.esteps div { display: flex; gap: 12px; padding: 3px 0; } .esteps div span { color: var(--muted); min-width: 160px; } .esteps div b { font-weight: 500; }
#d-secs { padding: 10px 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg); }
#d-secs[hidden] { display: none; }
#d-secs small { width: 100%; color: var(--muted); font-size: 12.5px; }
#d-secs button { font: inherit; font-size: 12.5px; background: none; border: 1px solid var(--rule); padding: 5px 9px; cursor: pointer; color: var(--ink); }
#d-secs button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.srow { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 18px; cursor: pointer; font: inherit; color: inherit; }
.srow b { font-weight: 500; display: block; } .srow span { color: var(--muted); font-size: 13.5px; }
.srow i { font-style: normal; float: right; font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--rule); padding: 2px 7px 1px; color: var(--muted); }
.srow i.open { border-color: var(--ink); color: var(--ink); }
.sgroup { border-bottom: 1px solid var(--ink); }
.sgroup > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: baseline; gap: 12px; }
.sgroup > summary::-webkit-details-marker { display: none; }
.sgroup > summary b { font-family: var(--sans); font-weight: 500; letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; }
.sgroup > summary span { color: var(--muted); font-size: 13.5px; flex: 1; }
.sgroup > summary em { font-style: normal; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--ink); padding: 8px 11px 7px; white-space: nowrap; cursor: pointer; }
.sgroup > summary em.need { background: var(--ink); color: var(--on-ink); }
.sgroup > summary span small { display: block; font-size: 13px; color: var(--ink); margin-top: 2px; }
.sgroup > summary { align-items: center; }
.sgroup > summary::after { content: "+"; color: var(--muted); } .sgroup[open] > summary::after { content: "\2212"; }
.sgroup .srow { padding-left: 30px; }
.sgroup .shist { padding: 10px 18px 2px 30px; font-family: var(--sans); font-size: .56rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.sgroup .srow.hist b { font-weight: 400; }
.sgroup .srow.hist { opacity: .92; } .sgroup .srow:last-child { border-bottom: 0; }
.srow.latest b::after { content: "latest"; margin-left: 10px; font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.sgroup > summary em.q { border-color: var(--ink); color: var(--ink); }
.srow.cur b { font-weight: 400; }
.srow .said { display: block; margin-top: 4px; color: var(--ink); font-size: 14px; }
/* DOCUMENTS (Cora's window; db/077; Lance, 23 Nov 2026: "It doesn't need a markup area. It should be a .pdf viewer that
   can handle multiple pages by scrolling"). The list is the job's PERMITTING folder as a tree: each round's folder,
   in the order of the rounds, opens to its files. A document open is its pages one under the other, the whole width,
   with - and + to zoom and his box for a correction under it. No drawing tools. */
.dfile b { font-weight: 400; overflow-wrap: anywhere; }
.dfile span { display: block; margin-top: 2px; }
.sgroup.dgroup > summary b { letter-spacing: .1em; }
#doc-open { display: flex; flex-direction: column; height: 100%; } #doc-open[hidden] { display: none; }
#doc-open .sbar b { font-weight: 500; flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14.5px; }
#d-scroll { flex: 1 1 0; min-height: 240px; overflow: auto; background: #d9d6cf; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
#d-wrap { width: 100%; margin: 0 auto; }
#d-wrap .pg { position: relative; display: block; width: 100%; background: #fff; margin: 0 0 8px; }
#d-wrap .pg:last-child { margin-bottom: 0; }
#d-wrap .pg img { display: block; width: 100%; height: 100%; }
#d-wrap .pg i { position: absolute; right: 8px; bottom: 6px; font-style: normal; font-size: 11px; line-height: 1.5; color: var(--muted); background: rgba(252, 251, 249, .88); padding: 0 6px; }
#d-wrap .st { margin: 0; padding: 28px 18px; color: var(--muted); background: var(--bg); }
.sscore { padding: 12px 18px 16px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 13.5px; }
.sscore summary { cursor: pointer; font-family: var(--sans); letter-spacing: .14em; text-transform: uppercase; font-size: .62rem; color: var(--ink); }
.sscore table { border-collapse: collapse; margin-top: 10px; width: 100%; max-width: 560px; } .sscore td, .sscore th { text-align: left; padding: 4px 14px 4px 0; font-weight: 400; }
.sscore th { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; } .sscore td.n { font-variant-numeric: tabular-nums; }
/* A sheet open for his marks, top to bottom: its buttons, the sheet, his answer, what was said about it (Lance, 23 Nov
   2026: "switch the description the image location so that the image is below the buttons. Also the size needs to be
   formatted to the proportions of a 24x36 sheet. The current window crops"). The sheet's window has the shape of a
   24x36 sheet lying down (3 wide to 2 high), and the picture is fitted whole into it when it opens (fit(), below), so
   nothing is cut off until he zooms in. The description is LAST, under his answer box and its buttons, at its full
   length with no scrolling window of its own; when it is long the whole page scrolls (Lance, 26 Nov 2026: "move this
   descriptor down below my response area on the markup pages. Also if it's down there it doesn't need to be enclosed
   in a scrolling window"). Only with the phone on its side does it scroll in its place, since the sheet has the screen. */
#sheet-open { display: flex; flex-direction: column; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; } #sheet-open[hidden] { display: none; }
.sbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.sbar b { font-weight: 500; flex: 1; min-width: 120px; } .sbar .tools { display: flex; gap: 6px; }
.sbar button { background: none; border: 1px solid var(--ink); color: var(--ink); padding: 8px 11px; cursor: pointer; font-family: var(--sans); text-transform: uppercase; letter-spacing: .14em; font-size: .6rem; }
.sbar button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
#s-note { flex: none; padding: 12px 14px 18px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
#s-note:empty { padding: 0; border-top: 0; }
#sheet-open .sanswer { flex: none; border-top: 0; }
#s-scroll { flex: none; width: 100%; aspect-ratio: 3 / 2; max-height: max(160px, calc(100vh - 420px)); overflow: auto; background: #d9d6cf; border-bottom: 1px solid var(--rule); -webkit-overflow-scrolling: touch; }

    var mid = function (t) { var r = box.getBoundingClientRect(); return { x: (t[0].clientX + t[1].clientX) / 2 - r.left, y: (t[0].clientY + t[1].clientY) / 2 - r.top, d: Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) || 1 }; };
    var at = function (z, fx, fy, x, y) { docZoom(z); box.scrollLeft = fx * box.scrollWidth - x; box.scrollTop = fy * box.scrollHeight - y; };
    box.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 2) return;
      var m = mid(e.touches);
      g = { d: m.d, z: DOC.zoom, fx: (box.scrollLeft + m.x) / box.scrollWidth, fy: (box.scrollTop + m.y) / box.scrollHeight };
      e.preventDefault();
    }, { passive: false });
    box.addEventListener('touchmove', function (e) {

    var end = function (e) { if (e.touches.length < 2) g = null; };

    box.addEventListener('gesturestart', function (e) { e.preventDefault(); });          // the phone's own page zoom stays out of it
    box.addEventListener('wheel', function (e) {
      if (!e.ctrlKey) return;
      e.preventDefault();
      var r = box.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      at(DOC.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), (box.scrollLeft + x) / box.scrollWidth, (box.scrollTop + y) / box.scrollHeight, x, y);
    }, { passive: false });
  })();
  function loadSheets() {
    if (WHO === 'cora') return loadDocs();                      // her middle tab is Documents; Drew's is his sheets
    Promise.all([rpc('office_drew_checkins', { p_token: token, p_proj: NO, p_who: WHO }),
                 WHO === 'drew' ? rpc('office_job_sheets', { p_token: token, p_proj: NO }).catch(function () { return null; }) : null]).then(function (both) {
      var d = both[0], plotted = {};
      if (!d || !d.ok) return;
      ((both[1] && both[1].sheets) || []).forEach(function (x) { plotted[x.sheet] = x; });
      SH.list = d.checkins || [];
      // One group per sheet, in the order of the set. In a group there is ONE thing to open: the sheet as last
      // plotted (for something with no plot, the model or a page of Cora's: the latest picture). Opening it is what
      // clears "Needs you" on that sheet. Under it is the history, newest first: what he drew or said, and what the
      // team member said each time (Lance, 22 Nov 2026: "the check ins should be always on this latest drawing and
      // then we'll save the markups below as a history rather than tying the markup to each one Drew produces").
      var label = {}, ord = {}; (d.kinds || []).forEach(function (k) { label[k.key] = k.label; ord[k.key] = k.ord; });
      var groups = {}, order = [];
      SH.list.forEach(function (c) {
        var g = c.sheet || 'Other';
        if (!groups[g]) { groups[g] = { sheet: g, kind: c.sheet_kind, items: [] }; order.push(g); }
        groups[g].items.push(c);
      });
      // a sheet is on the list from the moment it is plotted, whether or not anything has been said about it yet
      Object.keys(plotted).forEach(function (g) { if (!groups[g]) { groups[g] = { sheet: g, kind: plotted[g].sheet_kind, items: [] }; order.push(g); } });
      // The order of the set (station/plots.py, _order): T, A, S, D, then any sheet a job adds, by its letter (F, P, R,
      // or one never seen before). The model comes first; the calcs and anything without a sheet number come last.
      var setOrder = function (g) {
        var m = /^([A-Z]{1,2})-(\d+)\.(\d+)$/.exec(String(g.sheet || '').toUpperCase()), k = ord[g.kind] || 999;
        if (!m) return [k < 10 ? 0 : 3, k, '', 0, 0];
        var f = m[1].length === 1 ? 'TASD'.indexOf(m[1]) : -1;
        return [f >= 0 ? 1 : 2, f >= 0 ? f : 0, f >= 0 ? '' : m[1], +m[2], +m[3]];
      };
      order.sort(function (a, b) {
        var x = setOrder(groups[a]), y = setOrder(groups[b]);
        for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
        return a < b ? -1 : a > b ? 1 : 0;
      });
      var mine = function (c) { return c.note === 'The whole sheet as last plotted.'; };      // a markup of his, kept as history
      var row = function (c) {
        return '<button class="srow hist" type="button" data-sheet="' + c.id + '"><i>' + (mine(c) ? 'You' : T.name) + '</i><b>' +
          (mine(c) ? (c.marks ? 'You drew ' + c.marks + (c.marks === 1 ? ' mark' : ' marks') : 'You said') : esc(c.title)) + '</b>' +
          '<span>' + esc(stamp(mine(c) ? (c.answered_at || c.created_at) : c.created_at)) + (!mine(c) && c.note ? ' · ' + esc(c.note) : '') +
          (!mine(c) && c.state === 'ok' ? ' · you said it looks right' : '') + '</span>' +
          (c.lance_said ? '<span class="said">' + (mine(c) ? '' : 'You said: ') + esc(ATT.quiet(c.lance_said)) + '</span>' : '') + '</button>';
      };
      var score = (d.score || []).filter(function (s) { return s.shown; });
      var html = order.map(function (g) {
        var G = groups[g], waiting = G.items.filter(function (c) { return c.state === 'open'; }).length, P = plotted[g];
        var isOpen = !!SH.openGroups[g];      // every sheet starts shut, so he finds the one to review at a glance (Lance, 21 Nov 2026)
        var shown = G.items.filter(function (c) { return !mine(c); })[0], top = G.items[0];
        // The tag on the row is the button into the sheet's latest drawing, and says where the sheet stands: Needs you,
        // With Drew (he has your marks), or simply Open. The plus and minus fold the history under it and nothing else.
        var tag = waiting ? 'Needs you' : top && (mine(top) || top.state === 'marked') ? 'With ' + T.name : 'Open';
        return '<details class="sgroup" data-group="' + esc(g) + '"' + (isOpen ? ' open' : '') + '><summary><b>' + esc(g) + '</b><span>' + esc(label[G.kind] || '') +
          (waiting && shown ? '<small>' + T.name + ': ' + esc(shown.title) + '</small>' : '') + '</span>' +
          (P || shown ? '<em role="button" tabindex="0" data-cur="' + esc(g) + '" class="' + (waiting ? 'need' : 'q') + '">' + tag + '</em>' : '') + '</summary>' +
          (G.items.length ? '<div class="shist">History</div>' + G.items.map(row).join('') : '<div class="shist">No history yet</div>') + '</details>';
      }).join('');
      if (score.length) {
        html += '<details class="sscore"' + (SH.openGroups._score ? ' open' : '') + ' data-group="_score"><summary>How ' + T.name + ' is doing, last 30 days, all jobs</summary><table><tr><th>Kind of sheet</th><th>Shown</th><th>You drew on</th><th>Marks</th></tr>' +
          score.map(function (s) { return '<tr><td>' + esc(s.label) + '</td><td class="n">' + s.shown + '</td><td class="n">' + s.drawn_on + '</td><td class="n">' + s.marks + '</td></tr>'; }).join('') +
          '</table><p style="margin:8px 0 0">Fewer marks per sheet over the weeks is the measure. Corrections you only typed are not counted as marks.</p></details>';
      }
      $('sheet-list').innerHTML = order.length ? html
        : '<p class="none">No check-ins on this job yet. ' + T.name + ' posts one when ' + (WHO === 'cora' ? 'she wants' : 'he wants') + ' you to look at something.</p>';
    }).catch(function () {});
  }
  // HIS MARKS ARE DRAWN LINES, NOT A PICTURE (Lance, 25 Nov 2026: "When zoomed all the way in there's a lag drawing the
  // red line. It sometimes shows up, sometimes it doesn't"). They were painted on a canvas the size of the whole zoomed
  // sheet: at full zoom on a phone that is some 11,000 by 7,400 dots, more than a phone gives a canvas (so nothing
  // showed), and it was made again on every move of the finger (so it lagged). Each mark is now one line over the
  // sheet, in the picture's own measure: it has no size to run out of, it is sharp at any zoom, and a move of the
  // finger adds to the one line being drawn and touches nothing else. Do not go back to a canvas here.
  function inkWidth() {            // the line is 3px on the screen whatever the zoom
    var img = $('s-img'), w = img.clientWidth;
    if (w && img.naturalWidth) $('s-g').setAttribute('stroke-width', (3 * img.naturalWidth / w).toFixed(2));
  }
  function paint() {
    var img = $('s-img'), nw = img.naturalWidth, nh = img.naturalHeight, g = $('s-g');
    if (!nw || !nh) return;
    var box = '0 0 ' + nw + ' ' + nh, all = SH.strokes.concat(SH.cur ? [SH.cur] : []);
    if ($('s-ink').getAttribute('viewBox') !== box) { $('s-ink').setAttribute('viewBox', box); g.textContent = ''; }
    inkWidth();
    while (g.childNodes.length > all.length) g.removeChild(g.lastChild);
    all.forEach(function (st, i) {
      var el = g.childNodes[i] || g.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'polyline'));
      if (el._st === st && el._n === st.length) return;       // this mark is already drawn as it stands
      var a = st.map(function (p) { return (p[0] * nw).toFixed(1) + ',' + (p[1] * nh).toFixed(1); });
      if (a.length === 1) a.push((st[0][0] * nw + .5).toFixed(1) + ',' + (st[0][1] * nh + .5).toFixed(1));      // a tap is a dot
      el.setAttribute('points', a.join(' ')); el._st = st; el._n = st.length;
    });
  }
  // The picture is fitted WHOLE into the sheet's window: as wide as the window when it has a sheet's proportions, and
  // narrower (centred) when it is taller than a sheet, a portrait page or a screen picture. Zooming is from there.
  function fit() {
    var box = $('s-scroll'), img = $('s-img'), nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh || !box.clientWidth) return;
    SH.base = Math.max(60, Math.floor(Math.min(box.clientWidth, box.clientHeight * nw / nh)));
    $('s-wrap').style.width = Math.round(SH.base * SH.zoom) + 'px';
    setTimeout(paint, 30);
  }
  function setZoom(z) { SH.zoom = Math.max(1, Math.min(6, z)); fit(); }
  // one entry of the history: that picture as it was, with his marks on it, to look at (nothing to send from here)
  function openSheet(id) {
    showSheets(); $('sheet-list').hidden = true; $('sheet-open').hidden = false; $('s-title').textContent = 'Opening…'; $('s-msg').textContent = '';
    rpc('office_drew_checkin', { p_token: token, p_id: +id }).then(function (d) {
      if (!d || !d.ok) return;
      SH.open = d; SH.open.history = true; SH.strokes = (d.marks || []).slice(); SH.cur = null;
      $('s-title').textContent = d.title; $('s-note').innerHTML = listy(esc((d.note || '') + (d.lance_said ? ' You said: ' + ATT.quiet(d.lance_said) : '')), '\n'); $('s-text').value = '';
      document.querySelector('#sheet-open .sanswer').hidden = true;
      $('s-img').onload = function () { setZoom(1); };
      $('s-img').src = 'data:' + (d.mime || 'image/png') + ';base64,' + d.image;
    }).catch(function () { $('s-title').textContent = 'Could not open it.'; });
  }
  // The sheet itself: its latest drawing. Opening it is what tells P4 he has looked (nothing on this sheet waits on him
  // after that); what he draws or says here is kept in the sheet's history and handed on.
  function openCurrent(sheet) {
    showSheets(); $('sheet-list').hidden = true; $('sheet-open').hidden = false; $('s-title').textContent = 'Opening…'; $('s-msg').textContent = '';
    rpc('office_sheet_open', { p_token: token, p_proj: NO, p_sheet: sheet, p_who: WHO }).then(function (d) {
      if (!d || !d.ok || !d.sheet) { $('s-title').textContent = 'Could not open it.'; return; }
      if (d.wait) {                                         // a sheet listed from the job's plotted set: its picture is made the first time it is opened (db/078)
        SH.tries = (SH.tries || 0) + 1;
        $('s-title').textContent = sheet + (SH.tries > 12 ? ': still getting it ready (the office PC has to be on)\u2026' : ': getting it ready\u2026');
        SH.open = { current: sheet, waiting: true }; $('s-img').removeAttribute('src'); document.querySelector('#sheet-open .sanswer').hidden = true;
        if (SH.tries < 60) SH.wait = setTimeout(function () { if (SH.open && SH.open.current === sheet && SH.open.waiting) openCurrent(sheet); }, 1500);
        return;
      }
      SH.tries = 0;
      SH.open = { current: sheet }; SH.strokes = []; SH.cur = null;
      $('s-title').textContent = sheet === 'Other' ? 'The latest picture' : sheet + (d.plotted ? ', as last plotted' : '');
      $('s-note').innerHTML = listy(esc((d.says ? T.name + ', ' + stamp(d.says.at) + ': ' + d.says.title + (d.says.note ? '. ' + d.says.note : '') : '') +
        (d.plotted ? (d.says ? ' ' : '') + '(Plotted ' + stamp(d.plotted) + '.)' : '')), '\n');
      $('s-text').value = '';
      document.querySelector('#sheet-open .sanswer').hidden = false; $('s-ok').hidden = !d.says;
      $('s-img').onload = function () { setZoom(1); };
      $('s-img').src = 'data:' + (d.mime || 'image/jpeg') + ';base64,' + d.image;
    }).catch(function () { $('s-title').textContent = 'Could not open it.'; });
  }
  function closeSheet() { clearTimeout(SH.wait); SH.tries = 0; $('s-ok').hidden = false; document.querySelector('#sheet-open .sanswer').hidden = false; SH.open = null; $('sheet-open').hidden = true; $('sheet-list').hidden = false; loadSheets(); }
  function frac(e) { var r = $('s-img').getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; }
  var cvs = $('s-canvas');
  cvs.classList.add('draw');
  // One finger (or the mouse, or a pencil) draws. Two fingers move the sheet and pinch it bigger or smaller, the
  // way a phone does everywhere else; the stroke the first finger had started is dropped.
  var fingers = {}, gest = null, spent = false, sc = $('s-scroll');
  function two() { var k = Object.keys(fingers); return k.length >= 2 ? [fingers[k[0]], fingers[k[1]]] : null; }
  cvs.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') fingers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var t = two();
    if (t) {                                             // a second finger: this is a move, not a mark
      e.preventDefault(); SH.cur = null; spent = true; paint();
      var r = sc.getBoundingClientRect(), cx = (t[0].x + t[1].x) / 2, cy = (t[0].y + t[1].y) / 2;
      gest = { d: Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y) || 1, z: SH.zoom, ax: (sc.scrollLeft + cx - r.left) / SH.zoom, ay: (sc.scrollTop + cy - r.top) / SH.zoom };
      return;
    }
    if (spent || !(SH.draw || e.pointerType === 'pen')) return;
    e.preventDefault(); try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    SH.cur = [frac(e)]; paint();
  });
  cvs.addEventListener('pointermove', function (e) {
    if (fingers[e.pointerId]) fingers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var t = gest && two();
    if (t) {
      e.preventDefault();
      var r = sc.getBoundingClientRect(), cx = (t[0].x + t[1].x) / 2, cy = (t[0].y + t[1].y) / 2;
      var z = Math.max(1, Math.min(6, gest.z * Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y) / gest.d));
      if (Math.abs(z - SH.zoom) > 0.01) { SH.zoom = z; $('s-wrap').style.width = Math.round((SH.base || sc.clientWidth) * z) + 'px'; inkWidth(); }
      sc.scrollLeft = gest.ax * SH.zoom - (cx - r.left); sc.scrollTop = gest.ay * SH.zoom - (cy - r.top);
      return;
    }
    if (SH.cur && !gest) { e.preventDefault(); SH.cur.push(frac(e)); paint(); }
  });
  var endStroke = function (e) {
    delete fingers[e.pointerId];
    if (gest) { if (!two()) { gest = null; paint(); } }
    else if (SH.cur) { SH.strokes.push(SH.cur); SH.cur = null; paint(); }
    if (!Object.keys(fingers).length) spent = false;     // every finger is up: the next touch may draw again
  };
  cvs.addEventListener('pointerup', endStroke); cvs.addEventListener('pointercancel', endStroke);
  $('s-draw').addEventListener('click', function () { SH.draw = !SH.draw; this.setAttribute('aria-pressed', SH.draw ? 'true' : 'false'); this.textContent = SH.draw ? 'Draw' : 'Move'; cvs.classList.toggle('draw', SH.draw); });
  $('s-undo').addEventListener('click', function () { SH.strokes.pop(); paint(); });
  $('s-clear').addEventListener('click', function () { SH.strokes = []; paint(); });
  // on a PC: Ctrl and the wheel (or two fingers on a trackpad) make the sheet larger or smaller, as a phone's two fingers do
  sc.addEventListener('wheel', function (e) { if (!e.ctrlKey || !SH.open) return; e.preventDefault(); setZoom(SH.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });
  // A large phone is the wide layout on its side and the phone's tabs upright, so turning it crosses between the two.
  // A sheet or a document he has open stays in front both ways (upright, the tabs would otherwise show the conversation).
  var wasWide = window.innerWidth > 860;
  window.addEventListener('resize', function () {
    var wide = window.innerWidth > 860;
    if (wide !== wasWide && DOC.open && DOC.open.engr) { if (wide ? $('main').getAttribute('data-show') === 'engr' : !$('stage-engr').hidden) showEngr(); }
    else if (wide !== wasWide && (SH.open || DOC.open) && (wide ? $('main').getAttribute('data-show') === 'sheets' : !$('stage-sheets').hidden)) showSheets();
    wasWide = wide;
    if (SH.open) fit(); else paint();                    // turned, or the window changed: fitted again
  });
  // a phone says it has turned before its screen has settled: fit again once it has. His marks stay where they are on
  // the drawing (they are kept as fractions of the picture), and so does how far he had zoomed.
  var refit = function () { if (SH.open) { fit(); setTimeout(fit, 250); setTimeout(fit, 700); } };
  if (TURNED.addEventListener) TURNED.addEventListener('change', refit); else if (TURNED.addListener) TURNED.addListener(refit);
  window.addEventListener('orientationchange', refit);
  $('s-back').addEventListener('click', closeSheet);       // turned, the tabs are under the sheet: this goes back to the list
  function sendMark(ok) {
    if (!SH.open) return;
    var text = ATT.join('sheet', $('s-text').value);         // a picture or file he attached to the markup goes with his words
    if (text === null) { $('s-msg').textContent = ATT.WAIT; return; }
    // long strokes are thinned so the message stays small
    var marks = ok ? [] : SH.strokes.map(function (st) { var k = Math.ceil(st.length / 60); return st.filter(function (_, i) { return i % k === 0 || i === st.length - 1; }).map(function (p) { return [+p[0].toFixed(4), +p[1].toFixed(4)]; }); });
    if (!ok && !marks.length && !text) { $('s-msg').textContent = 'Draw on it or say what to change.'; return; }
    $('s-msg').textContent = 'Sending…';
    if (!SH.open.current) return;
    rpc('office_sheet_say', { p_token: token, p_proj: NO, p_sheet: SH.open.current, p_who: WHO, p_marks: marks, p_text: text || null, p_ok: !!ok }).then(function (d) {
      if (d && d.ok && d.saved) { $('s-msg').textContent = ''; ATT.clear('sheet'); closeSheet(); loop(); }
      else $('s-msg').textContent = d && d.ok ? 'Not sent: ' + (d.why || 'try again') + '.' : 'Signed out. Open the dashboard and sign in.';
    }).catch(function (e) { $('s-msg').textContent = 'Not sent (' + e.message + '). Your marks are still here.'; });
  }
  $('s-send').addEventListener('click', function () { sendMark(false); });
  $('s-ok').addEventListener('click', function () { sendMark(true); });
  document.addEventListener('click', function (e) {
    var dd = e.target.closest && e.target.closest('[data-doc]'); if (dd) { e.preventDefault(); openDoc(+dd.getAttribute('data-doc')); return; }
    var c = e.target.closest && e.target.closest('[data-cur]'); if (c) { e.preventDefault(); openCurrent(c.getAttribute('data-cur')); return; }
    var a = e.target.closest && e.target.closest('[data-sheet]'); if (a) openSheet(a.getAttribute('data-sheet'));
  });
  setInterval(function () { if (sheetsShowing() && !SH.open && !DOC.open) loadSheets(); }, 10000);
  loadSheets();
  loop();
  live();
})();
