    try {

  var SH = { list: [], open: null, strokes: [], zoom: 1, draw: true, cur: null, openGroups: {} };
  $('sheet-list').addEventListener('toggle', function (e) {            // remember which sheets he has open
    var g = e.target.getAttribute && e.target.getAttribute('data-group'); if (g) SH.openGroups[g] = e.target.open;
  }, true);
  function showSheets() {
    var b = window.innerWidth > 860 ? document.querySelector('.switch [data-stage="sheets"]') : document.querySelector('.tabs [data-show="sheets"]');
    SH.staying = true;                                     // the page itself bringing Sheets forward is not him asking for the list
    if (b) b.click();
    SH.staying = false;
  }
  function sheetsShowing() { return !document.hidden && !$('stage-sheets').hidden && (window.innerWidth > 860 || $('main').getAttribute('data-show') === 'sheets'); }
  function loadSheets() {
    Promise.all([rpc('office_drew_checkins', { p_token: token, p_proj: NO, p_who: WHO }),
                 WHO === 'drew' ? rpc('office_job_sheets', { p_token: token, p_proj: NO }).catch(function () { return null; }) : null]).then(function (both) {
      var d = both[0], plotted = {};
      if (!d || !d.ok) return;
      ((both[1] && both[1].sheets) || []).forEach(function (x) { plotted[x.sheet] = x; });
      SH.list = d.checkins || [];
      // One group per sheet, in the order of the set. In a group there is ONE thing to open: the sheet as last
      // plotted (for something with no plot, the model or a page of Cora's: the latest picture). Opening it is what
      // clears "Needs you" on that sheet. Under it is the history, newest first: what he drew or said, and what the
      // team member said each time (Lance, 22 Nov 2026: "the check ins should be always on this latest drawing and
      // then we'll save the markups below as a history rather than tying the markup to each one Drew produces").
      var label = {}, ord = {}; (d.kinds || []).forEach(function (k) { label[k.key] = k.label; ord[k.key] = k.ord; });
      var groups = {}, order = [];
      SH.list.forEach(function (c) {
        var g = c.sheet || 'Other';
        if (!groups[g]) { groups[g] = { sheet: g, kind: c.sheet_kind, items: [] }; order.push(g); }
        groups[g].items.push(c);
      });
      // a sheet is on the list from the moment it is plotted, whether or not anything has been said about it yet
      Object.keys(plotted).forEach(function (g) { if (!groups[g]) { groups[g] = { sheet: g, kind: plotted[g].sheet_kind, items: [] }; order.push(g); } });
      order.sort(function (a, b) { var x = groups[a], y = groups[b]; return ((ord[x.kind] || 999) - (ord[y.kind] || 999)) || (a < b ? -1 : 1); });
      var mine = function (c) { return c.note === 'The whole sheet as last plotted.'; };      // a markup of his, kept as history
      var row = function (c) {
        return '<button class="srow hist" type="button" data-sheet="' + c.id + '"><i>' + (mine(c) ? 'You' : T.name) + '</i><b>' +
          (mine(c) ? (c.marks ? 'You drew ' + c.marks + (c.marks === 1 ? ' mark' : ' marks') : 'You said') : esc(c.title)) + '</b>' +
          '<span>' + esc(stamp(mine(c) ? (c.answered_at || c.created_at) : c.created_at)) + (!mine(c) && c.note ? ' · ' + esc(c.note) : '') +
          (!mine(c) && c.state === 'ok' ? ' · you said it looks right' : '') + '</span>' +
          (c.lance_said ? '<span class="said">' + (mine(c) ? '' : 'You said: ') + esc(c.lance_said) + '</span>' : '') + '</button>';
      };
      var score = (d.score || []).filter(function (s) { return s.shown; });
      var html = order.map(function (g) {
        var G = groups[g], waiting = G.items.filter(function (c) { return c.state === 'open'; }).length, P = plotted[g];
        var isOpen = !!SH.openGroups[g];      // every sheet starts shut, so he finds the one to review at a glance (Lance, 21 Nov 2026)
        var shown = G.items.filter(function (c) { return !mine(c); })[0], top = G.items[0];
        // The tag on the row is the button into the sheet's latest drawing, and says where the sheet stands: Needs you,
        // With Drew (he has your marks), or simply Open. The plus and minus fold the history under it and nothing else.
        var tag = waiting ? 'Needs you' : top && (mine(top) || top.state === 'marked') ? 'With ' + T.name : 'Open';
        return '<details class="sgroup" data-group="' + esc(g) + '"' + (isOpen ? ' open' : '') + '><summary><b>' + esc(g) + '</b><span>' + esc(label[G.kind] || '') +
          (waiting && shown ? '<small>' + T.name + ': ' + esc(shown.title) + '</small>' : '') + '</span>' +
          (P || shown ? '<em role="button" tabindex="0" data-cur="' + esc(g) + '" class="' + (waiting ? 'need' : 'q') + '">' + tag + '</em>' : '') + '</summary>' +
          (G.items.length ? '<div class="shist">History</div>' + G.items.map(row).join('') : '<div class="shist">No history yet</div>') + '</details>';
      }).join('');
      if (score.length) {
        html += '<details class="sscore"' + (SH.openGroups._score ? ' open' : '') + ' data-group="_score"><summary>How ' + T.name + ' is doing, last 30 days, all jobs</summary><table><tr><th>Kind of sheet</th><th>Shown</th><th>You drew on</th><th>Marks</th></tr>' +
          score.map(function (s) { return '<tr><td>' + esc(s.label) + '</td><td class="n">' + s.shown + '</td><td class="n">' + s.drawn_on + '</td><td class="n">' + s.marks + '</td></tr>'; }).join('') +
          '</table><p style="margin:8px 0 0">Fewer marks per sheet over the weeks is the measure. Corrections you only typed are not counted as marks.</p></details>';
      }
      $('sheet-list').innerHTML = order.length ? html
        : '<p class="none">No check-ins on this job yet. ' + T.name + ' posts one when ' + (WHO === 'cora' ? 'she wants' : 'he wants') + ' you to look at something.</p>';
    }).catch(function () {});
  }
  function paint() {
    var cv = $('s-canvas'), img = $('s-img'), w = img.clientWidth, h = img.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!w || !h) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 3; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#DC1E1E';
    SH.strokes.concat(SH.cur ? [SH.cur] : []).forEach(function (st) {
      g.beginPath(); st.forEach(function (p, i) { if (i) g.lineTo(p[0] * w, p[1] * h); else g.moveTo(p[0] * w, p[1] * h); });
      if (st.length === 1) g.lineTo(st[0][0] * w + .1, st[0][1] * h + .1);
      g.stroke();
    });
  }
  function setZoom(z) { SH.zoom = Math.max(1, Math.min(6, z)); $('s-wrap').style.width = (SH.zoom * 100) + '%'; setTimeout(paint, 30); }
  // one entry of the history: that picture as it was, with his marks on it, to look at (nothing to send from here)
  function openSheet(id) {
    showSheets(); $('sheet-list').hidden = true; $('sheet-open').hidden = false; $('s-title').textContent = 'Opening…'; $('s-msg').textContent = '';
    rpc('office_drew_checkin', { p_token: token, p_id: +id }).then(function (d) {
      if (!d || !d.ok) return;
      SH.open = d; SH.open.history = true; SH.strokes = (d.marks || []).slice(); SH.cur = null;
      $('s-title').textContent = d.title; $('s-note').textContent = (d.note || '') + (d.lance_said ? ' You said: ' + d.lance_said : ''); $('s-text').value = '';
      document.querySelector('#sheet-open .sanswer').hidden = true;
      $('s-img').onload = function () { setZoom(1); };
      $('s-img').src = 'data:' + (d.mime || 'image/png') + ';base64,' + d.image;
    }).catch(function () { $('s-title').textContent = 'Could not open it.'; });
  }
  // The sheet itself: its latest drawing. Opening it is what tells P4 he has looked (nothing on this sheet waits on him
  // after that); what he draws or says here is kept in the sheet's history and handed on.
  function openCurrent(sheet) {
    showSheets(); $('sheet-list').hidden = true; $('sheet-open').hidden = false; $('s-title').textContent = 'Opening…'; $('s-msg').textContent = '';
    rpc('office_sheet_open', { p_token: token, p_proj: NO, p_sheet: sheet, p_who: WHO }).then(function (d) {
      if (!d || !d.ok || !d.sheet) { $('s-title').textContent = 'Could not open it.'; return; }
      SH.open = { current: sheet }; SH.strokes = []; SH.cur = null;
      $('s-title').textContent = sheet === 'Other' ? 'The latest picture' : sheet + (d.plotted ? ', as last plotted' : '');
      $('s-note').textContent = (d.says ? T.name + ', ' + stamp(d.says.at) + ': ' + d.says.title + (d.says.note ? '. ' + d.says.note : '') : '') +
        (d.plotted ? (d.says ? ' ' : '') + '(Plotted ' + stamp(d.plotted) + '.)' : '');
      $('s-text').value = '';
      document.querySelector('#sheet-open .sanswer').hidden = false; $('s-ok').hidden = !d.says;
      $('s-img').onload = function () { setZoom(1); };
      $('s-img').src = 'data:' + (d.mime || 'image/jpeg') + ';base64,' + d.image;
    }).catch(function () { $('s-title').textContent = 'Could not open it.'; });
  }
  function closeSheet() { $('s-ok').hidden = false; document.querySelector('#sheet-open .sanswer').hidden = false; SH.open = null; $('sheet-open').hidden = true; $('sheet-list').hidden = false; loadSheets(); }
  function frac(e) { var r = $('s-img').getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; }
  var cvs = $('s-canvas');
  cvs.classList.add('draw');
  // One finger (or the mouse, or a pencil) draws. Two fingers move the sheet and pinch it bigger or smaller, the
  // way a phone does everywhere else; the stroke the first finger had started is dropped.
  var fingers = {}, gest = null, spent = false, sc = $('s-scroll');
  function two() { var k = Object.keys(fingers); return k.length >= 2 ? [fingers[k[0]], fingers[k[1]]] : null; }
  cvs.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') fingers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var t = two();
    if (t) {                                             // a second finger: this is a move, not a mark
      e.preventDefault(); SH.cur = null; spent = true; paint();
      var r = sc.getBoundingClientRect(), cx = (t[0].x + t[1].x) / 2, cy = (t[0].y + t[1].y) / 2;
      gest = { d: Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y) || 1, z: SH.zoom, ax: (sc.scrollLeft + cx - r.left) / SH.zoom, ay: (sc.scrollTop + cy - r.top) / SH.zoom };
      return;
    }
    if (spent || !(SH.draw || e.pointerType === 'pen')) return;
    e.preventDefault(); try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    SH.cur = [frac(e)]; paint();
  });
  cvs.addEventListener('pointermove', function (e) {
    if (fingers[e.pointerId]) fingers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var t = gest && two();
    if (t) {
      e.preventDefault();
      var r = sc.getBoundingClientRect(), cx = (t[0].x + t[1].x) / 2, cy = (t[0].y + t[1].y) / 2;
      var z = Math.max(1, Math.min(6, gest.z * Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y) / gest.d));
      if (Math.abs(z - SH.zoom) > 0.01) { SH.zoom = z; $('s-wrap').style.width = (z * 100) + '%'; }
      sc.scrollLeft = gest.ax * SH.zoom - (cx - r.left); sc.scrollTop = gest.ay * SH.zoom - (cy - r.top);
      return;
    }
    if (SH.cur && !gest) { e.preventDefault(); SH.cur.push(frac(e)); paint(); }
  });
  var endStroke = function (e) {
    delete fingers[e.pointerId];
    if (gest) { if (!two()) { gest = null; paint(); } }
    else if (SH.cur) { SH.strokes.push(SH.cur); SH.cur = null; paint(); }
    if (!Object.keys(fingers).length) spent = false;     // every finger is up: the next touch may draw again
  };
  cvs.addEventListener('pointerup', endStroke); cvs.addEventListener('pointercancel', endStroke);
  $('s-draw').addEventListener('click', function () { SH.draw = !SH.draw; this.setAttribute('aria-pressed', SH.draw ? 'true' : 'false'); this.textContent = SH.draw ? 'Draw' : 'Move'; cvs.classList.toggle('draw', SH.draw); });
  $('s-undo').addEventListener('click', function () { SH.strokes.pop(); paint(); });
  $('s-clear').addEventListener('click', function () { SH.strokes = []; paint(); });
  $('s-in').addEventListener('click', function () { setZoom(SH.zoom * 1.5); });
  $('s-out').addEventListener('click', function () { setZoom(SH.zoom / 1.5); });
  window.addEventListener('resize', paint);
  function sendMark(ok) {
    if (!SH.open) return;
    var text = $('s-text').value.trim();
    // long strokes are thinned so the message stays small
    var marks = ok ? [] : SH.strokes.map(function (st) { var k = Math.ceil(st.length / 60); return st.filter(function (_, i) { return i % k === 0 || i === st.length - 1; }).map(function (p) { return [+p[0].toFixed(4), +p[1].toFixed(4)]; }); });
    if (!ok && !marks.length && !text) { $('s-msg').textContent = 'Draw on it or say what to change.'; return; }
    $('s-msg').textContent = 'Sending…';
    if (!SH.open.current) return;
    rpc('office_sheet_say', { p_token: token, p_proj: NO, p_sheet: SH.open.current, p_who: WHO, p_marks: marks, p_text: text || null, p_ok: !!ok }).then(function (d) {
      if (d && d.ok && d.saved) { $('s-msg').textContent = ''; closeSheet(); loop(); }
      else $('s-msg').textContent = d && d.ok ? 'Not sent: ' + (d.why || 'try again') + '.' : 'Signed out. Open the dashboard and enter your PIN.';
    }).catch(function (e) { $('s-msg').textContent = 'Not sent (' + e.message + '). Your marks are still here.'; });
  }
  $('s-send').addEventListener('click', function () { sendMark(false); });
  $('s-ok').addEventListener('click', function () { sendMark(true); });
  document.addEventListener('click', function (e) {
    var c = e.target.closest && e.target.closest('[data-cur]'); if (c) { e.preventDefault(); openCurrent(c.getAttribute('data-cur')); return; }
    var a = e.target.closest && e.target.closest('[data-sheet]'); if (a) openSheet(a.getAttribute('data-sheet'));
  });
  setInterval(function () { if (sheetsShowing() && !SH.open) loadSheets(); }, 10000);
  loadSheets();
  loop();
  live();
})();
</script>
